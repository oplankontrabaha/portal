/* ---------------- saved copies of what the server sent ---------------- */
function savedId(key) { return key === 'boot' ? 'boot' : ownerKey() + '::' + key; }
async function savedGet(key) {
  try {
    const r = await dbGet('cache', savedId(key));
    if (!r || !r.d) return null;
    if (key !== 'boot' && r.t <= (S.savedCut || 0)) return null;      // dropped a moment ago
    return { t: r.t, d: r.d };
  } catch (e) { return null; }
}
function savedPut(key, d) {
  const id = savedId(key);
  return dbPut('cache', { id: id, t: Date.now(), d: d }).then(() => { if (key.indexOf('ww:') === 0) savedTrim(id); })
    .catch(() => { /* no room: the page simply asks the server next time */ });
}
/* Copies of single waterways add up: only the 40 opened most recently are kept. */
function savedTrim(id) {
  let list = [];
  try { list = JSON.parse(localStorage.getItem('okb-portal-ww') || '[]'); } catch (e) { list = []; }
  if (!Array.isArray(list)) list = [];
  list = list.filter(x => x !== id);
  list.push(id);
  const drop = list.length > 40 ? list.splice(0, list.length - 40) : [];
  try { localStorage.setItem('okb-portal-ww', JSON.stringify(list)); } catch (e) { /* ignore */ }
  if (drop.length) dbDel('cache', drop).catch(() => {});
}
/* Forget this office's saved copies (after a change, or "Refresh"). */
function dropSaved() {
  S.savedCut = Date.now();
  S.maps = {};
  const mine = ownerKey() + '::';
  dbKeys('cache').then(keys => dbDel('cache', keys.filter(k => String(k).indexOf(mine) === 0))).catch(() => {});
}

/* ---------------- region figures: shown at once, refreshed quietly ---------------- */
const INFLIGHT = {};
function wantedRegion() { return isAdmin() ? (S.regionAbbr || 'ALL') : S.me.abbr; }
function savedRegion() { return !!(S.region && S.region.abbr === wantedRegion()); }
function regionSig(d) {
  const t = d.totals || {};
  return [d.version, d.waterways.length, t.planned, t.accomplished, t.photos, t.avgPercent, t.completed,
    (d.offices || []).filter(o => o.status === 'ACTIVE').length].join('|');
}
function fetchRegion(want) {
  const k = 'region:' + want;
  if (INFLIGHT[k]) return INFLIGHT[k];
  const owner = ownerKey();
  const p = api('regionData', { abbr: isAdmin() && want !== 'ALL' ? want : '' }).then(d => {
    d._at = Date.now();
    if (ownerKey() === owner) {
      if (wantedRegion() === want) S.region = d;
      savedPut(k, d);
    }
    return d;
  });
  INFLIGHT[k] = p;
  const clear = () => { if (INFLIGHT[k] === p) delete INFLIGHT[k]; };
  p.then(clear, clear);
  return p;
}
/* Asks the server again without holding the page; redraws it if the figures moved. */
function refreshRegion() {
  if (!S.me) return;
  const want = wantedRegion();
  const before = S.region && S.region.abbr === want ? regionSig(S.region) : '';
  fetchRegion(want).then(d => { if (wantedRegion() === want && regionSig(d) !== before) freshArrived(); }).catch(() => {});
}
async function getRegion(force) {
  const want = wantedRegion();
  const mem = S.region && S.region.abbr === want ? S.region : null;
  if (!force && mem) {
    if (Date.now() - mem._at > 180000) refreshRegion();
    return mem;
  }
  if (!force) {
    const hit = await savedGet('region:' + want);
    if (hit && wantedRegion() === want && hit.d && hit.d.abbr === want) {
      hit.d._at = hit.t;
      S.region = hit.d;
      if (Date.now() - hit.t > 45000) refreshRegion();
      return hit.d;
    }
  }
  return fetchRegion(want);
}

/* Map lines of the region. → { data, fresh? } where fresh is a promise of
   newer lines (or null) when a saved copy was given first. */
function mapSig(m) { return (m.g || '') + ':' + m.lines.length + ':' + m.lines.reduce((n, l) => (n + l.p * 31 + l.c) % 1000000007, 0); }
async function regionMapData() {
  const want = wantedRegion();
  const k = 'map:' + want;
  const mem = S.maps[want];
  if (mem && Date.now() - mem._at < 600000) return { data: mem };
  const owner = ownerKey();
  const ask = () => {
    if (INFLIGHT[k]) return INFLIGHT[k];
    const p = api('regionMap', { abbr: isAdmin() && want !== 'ALL' ? want : '' }).then(m => {
      m._at = Date.now();
      if (ownerKey() === owner) { S.maps[want] = m; savedPut(k, m); }
      return m;
    });
    INFLIGHT[k] = p;
    const clear = () => { if (INFLIGHT[k] === p) delete INFLIGHT[k]; };
    p.then(clear, clear);
    return p;
  };
  const hit = mem ? { d: mem } : await savedGet(k);
  if (hit && hit.d && hit.d.lines) {
    return { data: hit.d, fresh: ask().then(m => (mapSig(m) !== mapSig(hit.d) ? m : null)) };
  }
  return { data: await ask() };
}

/* Fresh figures arrived while a page was open. */
function freshArrived() {
  const r = currentRoute().name;
  if (r !== 'home' && r !== 'waterways') return;          // other pages read the figures when they open
  if (!S.viewTouched && !MODALS.length) { route(true); return; }
  let n = document.getElementById('freshNote');
  if (!n) {
    n = document.createElement('button');
    n.id = 'freshNote';
    n.type = 'button';
    n.className = 'fresh-note';
    n.innerHTML = ic('refresh') + '<span>New figures are in · show them</span>';
    document.body.appendChild(n);
  }
  n.onclick = () => { hideFreshNote(); route(true); };
  requestAnimationFrame(() => requestAnimationFrame(() => n.classList.add('show')));
}
function hideFreshNote() {
  const n = document.getElementById('freshNote');
  if (n) { n.classList.remove('show'); setTimeout(() => { if (!n.classList.contains('show')) n.remove(); }, 600); }
}
['pointerdown', 'keydown', 'input'].forEach(ev => document.addEventListener(ev, e => {
  if (e.target && e.target.closest && e.target.closest('#view')) S.viewTouched = true;
}, true));
window.addEventListener('scroll', () => { if (window.scrollY > 80) S.viewTouched = true; }, { passive: true });

/* =====================================================================
   OUTBOX
   item: { id, owner, seq, kind:'output'|'photo'|'finish', group, title, site,
           label, payload, status:'waiting'|'sending'|'failed', tries, nextAt,
           error, code, created }
   A photo's file is kept beside it in the "blobs" store under the same id.
   A batch of photos ends with one "finish" item that carries the batch's
   submission number and sends the receipt once the photos are in.
   ===================================================================== */
const OB = { items: [], recent: [], active: {}, listeners: [], started: false, leader: false, leadOwner: '', release: null, chan: null, timer: 0, wake: 0, doneAt: 0 };
const OB_RETRY = [4000, 10000, 30000, 60000, 120000, 300000];
const OB_PERMANENT = ['INPUT', 'FORBIDDEN', 'NOT_FOUND', 'STALE', 'SETUP'];

function outboxMine() { const o = ownerKey(); return o ? OB.items.filter(i => i.owner === o) : []; }
/* What the user thinks of as "things still to send". */
function outboxCount() { return outboxMine().filter(i => i.kind !== 'finish' && i.status !== 'failed').length; }
function outboxBusy() { return Object.keys(OB.active).length > 0 || (navigator.onLine !== false && outboxCount() > 0 && !!S.token); }
function outboxPending(name) {
  const k = norm(name);
  return outboxMine().filter(i => norm(i.title) === k && i.status !== 'failed' && i.kind !== 'finish');
}
function outboxOn(fn) { OB.listeners.push(fn); return () => { OB.listeners = OB.listeners.filter(f => f !== fn); }; }
function outboxChanged(tell, event) {
  paintSync();
  OB.listeners.slice().forEach(fn => { try { fn(event || null); } catch (e) { /* a page that left */ } });
  if (tell && OB.chan) { try { OB.chan.postMessage('changed'); } catch (e) { /* ignore */ } }
}
async function outboxLoad() {
  let rows = [];
  try { rows = await dbAll('outbox'); } catch (e) { rows = []; }
  const keep = {};
  OB.items.forEach(i => { if (OB.active[i.id]) keep[i.id] = i; });
  OB.items = rows.map(r => keep[r.id] || r).sort((a, b) => a.seq - b.seq);
}

/* Called once the user is signed in (and again after every sign-in). */
async function outboxStart() {
  if (!OB.started) {
    OB.started = true;
    try {
      OB.chan = new BroadcastChannel('okb-portal-outbox');
      /* another tab of this browser changed the outbox (it may be the one that sends) */
      OB.chan.onmessage = () => {
        const before = OB.items.slice();
        outboxLoad().then(() => {
          const now = {};
          OB.items.forEach(i => { now[i.id] = i; });
          outboxChanged();
          before.forEach(old => {
            if (OB.active[old.id]) return;
            const cur = now[old.id];
            if (!cur) outboxChanged(false, { type: old.kind, item: old, res: null });                       // sent by the other tab
            else if (cur.status === 'failed' && old.status !== 'failed') outboxChanged(false, { type: 'failed', item: cur });
          });
          outboxKick();
        });
      };
    } catch (e) { OB.chan = null; }
    window.addEventListener('online', () => { paintSync(); outboxKick(); });
    window.addEventListener('offline', paintSync);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) outboxKick(); });
    setInterval(outboxKick, 45000);
    window.addEventListener('beforeunload', e => {
      if (outboxBusy()) { e.preventDefault(); e.returnValue = ''; }
    });
  }
  await outboxLoad();
  outboxChanged();
  const owner = ownerKey();
  if (!owner) return;
  if (OB.leadOwner === owner) { outboxKick(); return; }
  outboxStop();
  OB.leadOwner = owner;
  const lead = async () => {
    if (OB.leadOwner !== owner) return;
    OB.leader = true;
    await outboxLoad();
    /* left "sending" by a page that was closed: they go back to waiting */
    const stuck = OB.items.filter(i => i.owner === owner && i.status === 'sending' && !OB.active[i.id]);
    stuck.forEach(i => { i.status = 'waiting'; });
    try { await dbPutMany(stuck.map(i => ({ store: 'outbox', obj: i }))); } catch (e) { /* ignore */ }
    outboxChanged();
    outboxKick();
  };
  /* with several tabs open for the same office, only one of them sends */
  if (navigator.locks && navigator.locks.request) {
    navigator.locks.request('okb-portal-outbox:' + owner, () => new Promise(resolve => {
      if (OB.leadOwner !== owner) { resolve(); return; }
      OB.release = resolve;
      lead();
    })).catch(() => { lead(); });
  } else {
    lead();
  }
}
/* Signing out: this page stops sending (the items stay on the device). */
function outboxStop() {
  OB.leader = false;
  OB.leadOwner = '';
  if (OB.release) { const r = OB.release; OB.release = null; r(); }
  paintSync();
}

/* items: outbox items without owner/seq; blobs: [{ id, buf, type }] */
async function outboxAdd(items, blobs) {
  const base = Date.now() * 100;
  items.forEach((it, i) => {
    it.owner = ownerKey(); it.seq = base + i; it.status = 'waiting'; it.tries = 0; it.nextAt = 0; it.error = ''; it.created = Date.now();
  });
  const pairs = (blobs || []).map(b => ({ store: 'blobs', obj: b })).concat(items.map(it => ({ store: 'outbox', obj: it })));
  try {
    await dbPutMany(pairs);
  } catch (err) {
    const e = new Error(/quota/i.test(String(err && (err.name || err.message)))
      ? 'This device has no room left to keep these for sending. Send fewer at a time, or wait for the ones being sent.'
      : 'This device could not keep these for sending. Please try again.');
    throw e;
  }
  OB.items = OB.items.concat(items);
  outboxChanged(true);
  outboxKick();
}
async function outboxRemove(item) {
  OB.items = OB.items.filter(x => x.id !== item.id);
  await dbDel('outbox', item.id);
  if (item.kind === 'photo') await dbDel('blobs', item.id);
}

function outboxKick() { clearTimeout(OB.timer); OB.timer = setTimeout(outboxPump, 40); }
function outboxPump() {
  if (!OB.leader || !S.token || !S.me) { paintSync(); return; }
  if (navigator.onLine === false) { paintSync(); return; }
  const now = Date.now();
  const mine = outboxMine();
  /* marked "sending" but nothing is sending it here for a long while: it waits again */
  mine.forEach(i => { if (i.status === 'sending' && !OB.active[i.id] && now - (i.sentAt || 0) > 480000) i.status = 'waiting'; });
  const acts = Object.keys(OB.active).map(id => OB.active[id]);
  const running = kind => acts.filter(a => a.kind === kind).length;
  const ready = i => i.status === 'waiting' && (i.nextAt || 0) <= now && !OB.active[i.id];

  /* outputs: one at a time, oldest first, so two for one waterway keep their order */
  if (!running('output')) {
    const next = mine.find(i => i.kind === 'output' && i.status !== 'failed');
    if (next && ready(next)) outboxSend(next);
  }
  /* photos: three at a time; the first of a batch goes alone and brings back the batch number */
  let slots = 3 - running('photo');
  const inGroup = {};
  acts.forEach(a => { if (a.kind === 'photo') inGroup[a.group] = (inGroup[a.group] || 0) + 1; });
  for (let n = 0; n < mine.length && slots > 0; n++) {
    const i = mine[n];
    if (i.kind !== 'photo' || !ready(i)) continue;
    const fin = mine.find(x => x.kind === 'finish' && x.group === i.group);
    if (!(fin && fin.payload.sid) && inGroup[i.group]) continue;
    inGroup[i.group] = (inGroup[i.group] || 0) + 1;
    slots--;
    outboxSend(i);
  }
  /* the closing note of a batch, once none of its photos is waiting */
  mine.forEach(i => {
    if (i.kind !== 'finish' || !ready(i)) return;
    if (!mine.some(x => x.kind === 'photo' && x.group === i.group && x.status !== 'failed')) outboxSend(i);
  });
  /* wake up for the next retry */
  const waits = mine.filter(i => i.status === 'waiting' && (i.nextAt || 0) > now).map(i => i.nextAt);
  clearTimeout(OB.wake);
  if (waits.length) OB.wake = setTimeout(outboxKick, Math.max(400, Math.min.apply(null, waits) - now + 60));
  paintSync();
}

async function outboxSend(item) {
  OB.active[item.id] = { kind: item.kind, group: item.group };
  item.status = 'sending';
  item.sentAt = Date.now();
  dbPut('outbox', item).catch(() => {});
  outboxChanged();
  let res = null, err = null;
  try { res = await outboxCall(item); } catch (e) { err = e; }
  delete OB.active[item.id];
  let event = null;
  try { event = err ? await outboxFailed(item, err) : await outboxSent(item, res); } catch (e) { /* storage hiccup: the next pass sorts it out */ }
  outboxChanged(true, event);
  outboxKick();
}

async function outboxCall(item) {
  const p = item.payload;
  if (item.kind === 'output') return api('submitOutput', Object.assign({ cid: item.id }, p));
  if (item.kind === 'photo') {
    const blob = await dbGet('blobs', item.id);
    if (!blob || !blob.buf) {
      const e = new Error('The photo file is no longer on this device. Please add it again.');
      e.code = 'INPUT';
      throw e;
    }
    const fin = OB.items.find(x => x.kind === 'finish' && x.group === item.group);
    const base64 = await blobToBase64(new Blob([blob.buf], { type: blob.type || 'image/jpeg' }));
    return api('uploadPhoto', Object.assign({ cid: item.id, batch: item.group, submissionId: (fin && fin.payload.sid) || '', base64: base64 }, p));
  }
  if (item.kind === 'finish') {
    if (!p.sent) return { skipped: true };
    return api('finishPhotos', { cid: item.id, submissionId: p.sid, name: p.name, site: p.site, sent: p.sent, failed: Math.max(0, p.total - p.sent) });
  }
  const e = new Error('Unknown kind of submission.');
  e.code = 'INPUT';
  throw e;
}

async function outboxSent(item, res) {
  await outboxRemove(item);
  if (item.kind === 'photo') {
    const fin = OB.items.find(x => x.kind === 'finish' && x.group === item.group);
    if (fin) {
      fin.payload.sent = (fin.payload.sent || 0) + 1;
      if (res && res.submissionId) fin.payload.sid = res.submissionId;
      await dbPut('outbox', fin);
    }
    return { type: 'photo', item: item, res: res };
  }
  OB.recent.unshift({ kind: item.kind, title: item.title, site: item.site, label: item.label, at: Date.now(), res: res, sent: item.payload.sent });
  OB.recent = OB.recent.slice(0, 20);
  OB.doneAt = Date.now();
  if (item.kind === 'finish' && res && res.skipped) return { type: 'finish', item: item, res: res };
  dropWaterwayCache(item.title);
  if (item.kind === 'output') savedPatchWaterway(item, res);
  toast(item.kind === 'output' ? 'Saved in the SSOT: ' + titleCase(item.title) + '.'
    : item.payload.sent + ' photo' + (item.payload.sent === 1 ? '' : 's') + ' of ' + titleCase(item.title) + ' uploaded.', 'ok');
  refreshRegion();
  const r = currentRoute();
  if (r.name === 'waterway' && norm(r.args[0]) === norm(item.title) && !S.viewTouched && !MODALS.length) route(true);
  setTimeout(paintSync, 4200);
  return { type: item.kind, item: item, res: res };
}

/* The head of a "sent in the background" window says where the work really is:
   on this device and on its way ('wait'), in the SSOT ('ok'), or refused ('bad').
   It never shows a green tick for something the SSOT does not have yet. */
function syncHead(m, state, doneTitle) {
  const h = $('.modal-head .h3', m.el);
  const b = $('.success .burst', m.el);
  const t = $('.modal-head .tile', m.el);
  const mark = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>';
  if (h) h.innerHTML = state === 'ok' ? doneTitle : state === 'bad' ? 'Not <em>saved</em>' : 'Saved on this <em>device</em>';
  if (b && b.dataset.state !== state) {
    b.dataset.state = state;
    b.className = 'burst' + (state === 'ok' ? '' : ' ' + state);
    b.innerHTML = state === 'ok' ? mark('M5 12.5l4.5 4.5L19 7') : state === 'bad' ? mark('M6.5 6.5l11 11M17.5 6.5l-11 11') : '<span class="spinner"></span>';
  }
  if (t) t.innerHTML = ic(state === 'ok' ? 'check' : state === 'bad' ? 'alert' : 'clock');
}

/* The copy of a waterway kept for no-signal use is brought up to date with
   what was just saved, so it does not show the marks as missing later. */
function savedPatchWaterway(item, res) {
  const key = 'ww:' + norm(item.title) + '|' + norm(item.site);
  savedGet(key).then(hit => {
    if (!hit || !hit.d || !hit.d.points) return;
    const d = hit.d;
    const at = {};
    d.points.forEach((p, i) => { at[p[0]] = i; });
    (item.payload.points || []).forEach(p => { const i = at[p.row]; if (i !== undefined) d.points[i][4] = p.cleaned ? 1 : 0; });
    if (res && res.stats) d.stats = Object.assign({}, d.stats, res.stats);
    if (res && res.volume && d.waterway) {
      d.waterway.accomplished = res.volume.total;
      if (res.volume.percent !== null && res.volume.percent !== undefined) d.waterway.percent = res.volume.percent;
    }
    delete d._offline;
    savedPut(key, d);
  }).catch(() => {});
}

async function outboxFailed(item, err) {
  const code = err.code || '';
  item.code = code;
  item.error = err.message || 'Could not be sent.';
  if (code === 'AUTH') {                       // signed out: it waits for the office to sign in again
    item.status = 'waiting'; item.error = '';
    await dbPut('outbox', item);
    return { type: 'wait', item: item };
  }
  if (OB_PERMANENT.indexOf(code) < 0) {
    if (navigator.onLine !== false) item.tries = (item.tries || 0) + 1;
    if (!(code === 'SERVER' && item.tries >= 6)) {
      item.status = 'waiting';
      item.nextAt = Date.now() + (code === 'BUSY' ? 8000 : OB_RETRY[Math.max(0, Math.min(OB_RETRY.length - 1, item.tries - 1))]);
      await dbPut('outbox', item);
      return { type: 'retry', item: item };
    }
  }
  item.status = 'failed';
  item.nextAt = 0;
  await dbPut('outbox', item);
  toast('Not saved: ' + titleCase(item.title) + (item.kind === 'photo' ? ' · ' + item.label : '') + ' — ' + item.error, 'bad', 9000);
  return { type: 'failed', item: item };
}

async function outboxRetry(item) {
  item.status = 'waiting'; item.tries = 0; item.nextAt = 0; item.error = '';
  await dbPut('outbox', item);
  outboxChanged(true);
  outboxKick();
}
async function outboxSendNow() {
  const list = outboxMine().filter(i => i.status === 'waiting' && !OB.active[i.id]);
  list.forEach(i => { i.nextAt = 0; });
  try { await dbPutMany(list.map(i => ({ store: 'outbox', obj: i }))); } catch (e) { /* ignore */ }
  outboxChanged();
  outboxKick();
}
async function outboxDiscard(item) {
  if (OB.active[item.id]) { toast('This one is being sent right now.', ''); return; }
  await outboxRemove(item);
  if (item.kind === 'photo') {
    /* a batch with no photos left needs no closing note */
    const fin = OB.items.find(x => x.kind === 'finish' && x.group === item.group);
    if (fin) { fin.payload.total = Math.max(fin.payload.sent || 0, (fin.payload.total || 1) - 1); await dbPut('outbox', fin); }
  }
  outboxChanged(true);
  outboxKick();
}

/* ---------------- what the user sees ---------------- */
function paintSync() {
  const chip = document.getElementById('syncChip');
  if (!chip) return;
  const mine = outboxMine();
  const failed = mine.filter(i => i.status === 'failed').length;
  const unsent = mine.filter(i => i.kind !== 'finish' && i.status !== 'failed').length;
  const sending = Object.keys(OB.active).length > 0;
  const offline = navigator.onLine === false;
  let cls = '', html = '';
  if (unsent) {
    if (offline) { cls = 'wait'; html = ic('clock') + '<span>' + unsent + ' waiting<span class="hide-sm"> · no signal</span></span>'; }
    else if (sending) { html = '<span class="spinner dark"></span><span>Sending ' + unsent + '</span>'; }
    else { cls = 'wait'; html = ic('clock') + '<span>' + unsent + ' waiting</span>'; }
    if (failed) html += '<span class="hide-sm"> · ' + failed + ' not saved</span>';
  } else if (failed) {
    cls = 'bad'; html = ic('alert') + '<span>' + failed + ' not saved</span>';
  } else if (Date.now() - OB.doneAt < 4000) {
    cls = 'ok'; html = ic('check') + '<span>All sent</span>';
  }
  chip.hidden = !html;
  chip.className = 'sync-chip ' + cls;
  chip.innerHTML = html;
  chip.title = 'Open the outbox';
}

function pendingPill(name) {
  return outboxPending(name).length ? ' <span class="pill navy">Sending…</span>' : '';
}
function pendingNote(name) {
  const list = outboxPending(name);
  if (!list.length) return '';
  const outs = list.filter(i => i.kind === 'output').length, photos = list.filter(i => i.kind === 'photo').length;
  const parts = [];
  if (outs) parts.push(outs === 1 ? 'an output' : outs + ' outputs');
  if (photos) parts.push(photos === 1 ? 'a photo' : photos + ' photos');
  return '<div class="pending-note"><span class="spinner dark"></span><div class="grow">Still being sent to the SSOT: ' + parts.join(' and ') +
    '. The figures here update by themselves once ' + (list.length === 1 ? 'it is' : 'they are') + ' in.</div>' +
    '<button class="link" onclick="openOutbox()">Outbox</button></div>';
}
/* A waterway as the user left it: marks and volumes still in the outbox are
   laid over what the server last sent. */
function applyPending(d) {
  const list = outboxPending(d.waterway.name).filter(i => i.kind === 'output');
  if (!list.length) return { points: d.points, accomplished: d.waterway.accomplished, pending: 0 };
  const points = d.points.map(p => p.slice());
  const at = {};
  points.forEach((p, i) => { at[p[0]] = i; });
  let acc = d.waterway.accomplished;
  list.forEach(it => {
    (it.payload.points || []).forEach(p => { const i = at[p.row]; if (i !== undefined) points[i][4] = p.cleaned ? 1 : 0; });
    const v = it.payload.volume;
    if (v) acc = v.mode === 'to' ? v.value : Math.round(((acc || 0) + v.value) * 100) / 100;
  });
  return { points: points, accomplished: acc, pending: list.length };
}

function openOutbox() {
  const m = openModal({
    title: 'Out<em>box</em>', sub: 'Saved on this device first, then sent to the OKB SSOT by itself', icon: 'send',
    body: '<div id="obBody"></div>',
    actions: [{ label: 'Send now', kind: 'primary', icon: 'refresh', close: false, id: 'obNow', onClick: () => { outboxSendNow(); return false; } }],
    onClose: () => off()
  });
  const draw = () => {
    const box = $('#obBody', m.el);
    if (!box) return;
    const mine = outboxMine();
    const others = OB.items.length - mine.length;
    const row = (it, extra) => {
      const act = !!OB.active[it.id];
      const state = it.status === 'failed' ? '<span class="pill bad">Not saved</span>' : act ? '<span class="pill navy">Sending…</span>'
        : it.error ? '<span class="pill wait">Will try again</span>' : '<span class="pill wait">Waiting</span>';
      return '<div class="ob-item">' + tile(it.kind === 'output' ? 'brush' : 'camera', it.status === 'failed' ? 'soft' : it.kind === 'output' ? 'orange' : '', 'sm') +
        '<div style="min-width:0"><b>' + esc(titleCase(it.title)) + '</b><div class="d">' + esc(it.label) + (extra || '') + '</div>' +
        (it.error ? '<div class="' + (it.status === 'failed' ? 'e' : 'd') + '">' + esc(it.error) + '</div>' : '') + '</div>' +
        '<div class="acts">' + state +
        (it.status === 'failed' ? '<button class="btn ghost xs" data-ob="retry" data-id="' + esc(it.id) + '">' + ic('refresh') + 'Try again</button>' : '') +
        (it.status === 'failed' && it.kind === 'output' ? '<button class="btn ghost xs" data-ob="open" data-id="' + esc(it.id) + '">' + ic('brush') + 'Redo</button>' : '') +
        (!act ? '<button class="btn ghost xs" data-ob="drop" data-id="' + esc(it.id) + '" title="Remove without sending">' + ic('trash') + '</button>' : '') + '</div></div>';
    };
    const outs = mine.filter(i => i.kind === 'output');
    const groups = {};
    mine.forEach(i => { if (i.kind !== 'output') (groups[i.group] = groups[i.group] || []).push(i); });
    let html = '<div class="callout ' + (navigator.onLine === false ? 'warn' : '') + '">' + ic(navigator.onLine === false ? 'clock' : 'info') + '<div class="small">' +
      (navigator.onLine === false ? '<b>No signal.</b> Everything here is kept and sent as soon as the signal is back. '
        : mine.length ? 'These are sent one after another. You can keep working or open another page. ' : '') +
      (DB.ok ? 'Unsent items stay on this device even if the page is closed.' : '<b>Keep this page open until everything is sent</b>: this browser cannot keep them after the page closes.') + '</div></div>';
    if (!mine.length) html += '<div class="empty small">' + tile('check', 'soft', 'lg') + 'Nothing is waiting. Everything has been sent.</div>';
    html += outs.map(i => row(i)).join('');
    Object.keys(groups).forEach(g => {
      const list = groups[g];
      const fin = list.find(i => i.kind === 'finish');
      const photos = list.filter(i => i.kind === 'photo');
      const total = fin ? fin.payload.total : photos.length;
      const sent = fin ? (fin.payload.sent || 0) : 0;
      const failed = photos.filter(i => i.status === 'failed');
      const title = (fin || photos[0]).title;
      html += '<div class="ob-item">' + tile('camera', '', 'sm') + '<div style="min-width:0"><b>' + esc(titleCase(title)) + '</b>' +
        '<div class="d">' + sent + ' of ' + total + ' photo' + (total === 1 ? '' : 's') + ' sent' + (failed.length ? ' · ' + failed.length + ' not saved' : '') + '</div>' +
        '<div class="bar thin ' + (sent >= total ? 'done' : 'mid') + '" style="margin-top:6px"><i style="width:' + (total ? sent / total * 100 : 0) + '%"></i></div></div>' +
        '<div class="acts">' + (photos.some(i => OB.active[i.id]) ? '<span class="pill navy">Sending…</span>' : photos.some(i => i.status === 'waiting') ? '<span class="pill wait">Waiting</span>' : '') + '</div></div>';
      html += failed.map(i => row(i)).join('');
    });
    if (others) html += '<p class="small muted mt-12">' + others + ' more from another office are kept on this device. They are sent when that office signs in here.</p>';
    if (OB.recent.length) {
      html += '<div class="label mt-16" style="margin-bottom:4px">Sent since this page was opened</div>' + OB.recent.map(r =>
        '<div class="ob-item">' + tile('check', 'soft', 'sm') + '<div style="min-width:0"><b>' + esc(titleCase(r.title)) + '</b><div class="d">' +
        esc(r.kind === 'finish' ? (r.sent || 0) + ' photo' + (r.sent === 1 ? '' : 's') + ' uploaded' : r.label) + '</div></div>' +
        '<div class="acts"><span class="pill ok">Saved</span></div></div>').join('');
    }
    box.innerHTML = html;
    const now = $('#obNow', m.el);
    if (now) now.disabled = navigator.onLine === false || !mine.some(i => i.status === 'waiting' && !OB.active[i.id]);
    $$('[data-ob]', box).forEach(b => {
      const it = OB.items.find(x => x.id === b.dataset.id);
      b.onclick = async () => {
        if (!it) return;
        if (b.dataset.ob === 'retry') return outboxRetry(it);
        if (b.dataset.ob === 'open') { m.close(); go('/output/' + encodePath(it.title, it.site)); return; }
        if (await confirmBox({ title: 'Remove without sending?', sub: esc(titleCase(it.title)) + ' · ' + esc(it.label), icon: 'trash', ok: 'Remove', okKind: 'accent' })) outboxDiscard(it);
      };
    });
  };
  const off = outboxOn(draw);
  draw();
  return m;
}

async function boot() {
  loadSession();
  const msg = $('#bootMsg'), spin = $('#bootSpin'), retry = $('#bootRetry');
  retry.hidden = true; spin.hidden = false;
  msg.textContent = 'Connecting to the OKB server…';
  const startUp = () => { if (S.token && S.me) enterApp(); else showGate('signin'); };
  /* The list of offices seldom changes: open at once from the copy kept on
     this device, and bring in the fresh list quietly. */
  const kept = await savedGet('boot');
  if (kept && kept.d && kept.d.offices && kept.d.offices.length) {
    S.boot = kept.d;
    S.bootAt = 0;
    startUp();
    refreshBoot();
    return;
  }
  try {
    S.boot = await api('bootstrap');
    S.bootAt = Date.now();
    savedPut('boot', S.boot);
  } catch (err) {
    spin.hidden = true;
    msg.textContent = err.message;
    retry.hidden = false;
    retry.onclick = boot;
    return;
  }
  startUp();
}

/* The list of offices and whether each is registered. Asked again whenever
   the sign-in page is shown or looked at again, so an office that was just
   approved can sign in without reloading the page. */
function refreshBoot(force) {
  if (S.bootBusy || (!force && Date.now() - (S.bootAt || 0) < 20000)) return Promise.resolve();
  S.bootBusy = true;
  return api('bootstrap').then(b => {
    S.boot = b;
    S.bootAt = Date.now();
    savedPut('boot', b);
    /* the office lists on the sign-in page draw themselves again */
    ['siSearch', 'rgSearch'].forEach(id => { const x = document.getElementById(id); if (x && typeof x.oninput === 'function') x.oninput(); });
  }).catch(() => {}).then(() => { S.bootBusy = false; });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !S.token && !$('#gate').hidden) refreshBoot(); });

function hideBoot() {
  const b = $('#boot');
  if (b.hidden) return;
  b.classList.add('fade');
  setTimeout(() => { b.hidden = true; }, 600);
}

/* 'CO' in the region list stands for the central offices (administrators). */
const CENTRAL = 'CO';
function hasCentral() { return ((S.boot && S.boot.offices) || []).some(o => o.type === CENTRAL); }
function regionOptions(selected, withAll, withCentral) {
  const regions = (S.boot && S.boot.regions) || [];
  return (withAll ? '<option value="">All regions</option>' : '<option value="">Choose your region…</option>') +
    regions.map(r => '<option value="' + esc(r.abbr) + '"' + (r.abbr === selected ? ' selected' : '') + '>' +
      esc(r.name || r.abbr) + '</option>').join('') +
    (withCentral && hasCentral() ? '<option value="' + CENTRAL + '"' + (selected === CENTRAL ? ' selected' : '') + '>Central offices (administrators)</option>' : '');
}
function officeGroup(o) { return o.type === CENTRAL ? CENTRAL : o.abbr; }
function officeStatusPill(o) {
  if (o.type === CENTRAL && o.status === 'ACTIVE') return '<span class="pill ok"><span class="dot"></span>' + (o.accounts || 1) + ' account' + (o.accounts === 1 ? '' : 's') + '</span>';
  if (o.status === 'ACTIVE') return '<span class="pill ok"><span class="dot"></span>Registered</span>';
  if (o.status === 'PENDING') return '<span class="pill wait"><span class="dot"></span>Pending</span>';
  return '<span class="pill no">Not registered</span>';
}
function officeList(abbr, q, selected) {
  const offices = ((S.boot && S.boot.offices) || []).filter(o => (!abbr || officeGroup(o) === abbr) &&
    (!q || norm(o.name + ' ' + o.short).includes(norm(q))));
  if (!offices.length) return '<div class="empty small">' + (abbr || q ? 'No office matches.' : 'Choose your region first.') + '</div>';
  return offices.map(o =>
    '<button type="button" class="office' + (o.id === selected ? ' on' : '') + '" data-id="' + esc(o.id) + '">' +
    tile(o.type === CENTRAL ? 'shield' : o.type === 'RO' ? 'building' : 'users', o.type === 'DEO' ? '' : 'orange', 'sm') +
    '<span class="o-main"><b>' + esc(o.type === 'RO' ? 'Regional Office · ' + o.abbr : o.short) + '</b><small>' +
    esc(o.type === CENTRAL ? (o.name === o.short ? 'Central office · administrator access' : o.name + ' · administrator access') : o.name) + '</small></span>' +
    officeStatusPill(o) + '</button>').join('');
}
function officeById(id) { return ((S.boot && S.boot.offices) || []).find(o => o.id === id) || null; }

/* 6 boxes that behave as one code field. Returns a getter. */
function mountCode(el, onComplete) {
  el.innerHTML = '<div class="code">' + Array.from({ length: 6 }, (_, i) =>
    '<input inputmode="numeric" autocomplete="' + (i === 0 ? 'one-time-code' : 'off') + '" maxlength="6" aria-label="Digit ' + (i + 1) + '">').join('') + '</div>';
  const boxes = $$('input', el);
  const value = () => boxes.map(b => b.value).join('');
  boxes.forEach((b, i) => {
    b.addEventListener('input', () => {
      const digits = b.value.replace(/\D/g, '');
      if (digits.length > 1) {
        digits.split('').slice(0, 6 - i).forEach((d, k) => { boxes[i + k].value = d; });
        const next = Math.min(5, i + digits.length);
        boxes[next].focus();
      } else {
        b.value = digits;
        if (digits && i < 5) boxes[i + 1].focus();
      }
      if (value().length === 6 && onComplete) onComplete(value());
    });
    b.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !b.value && i > 0) { boxes[i - 1].focus(); boxes[i - 1].value = ''; }
    });
  });
  setTimeout(() => boxes[0].focus(), 80);
  return {
    value,
    shake() { const c = $('.code', el); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); boxes.forEach(x => { x.value = ''; }); boxes[0].focus(); }
  };
}

function startResendTimer(btn, seconds) {
  clearInterval(SI.timer);
  let left = seconds || 60;
  const tick = () => {
    if (!document.body.contains(btn)) return clearInterval(SI.timer);
    if (left <= 0) { btn.disabled = false; btn.textContent = 'Send a new code'; clearInterval(SI.timer); return; }
    btn.disabled = true; btn.textContent = 'Send a new code in ' + left + 's'; left--;
  };
  tick();
  SI.timer = setInterval(tick, 1000);
}

        '<input class="input" id="siCoEmail" type="email" autocomplete="email" placeholder="you@' + esc((S.boot && S.boot.app && S.boot.app.domain) || 'dpwh.gov.ph') + '" value="' + esc(SI.email || '') + '"></div>' +
        '<div class="hint">' + esc(o.short) + ' signs in as an administrator. No account yet? <button class="link" id="siReg" style="padding:0;font-size:inherit">Register yours</button></div></div>';
      $('#siCoEmail').oninput = e => { SI.email = e.target.value; paintSend(); };
      $('#siCoEmail').onkeydown = e => { if (e.key === 'Enter' && !send.disabled) send.click(); };
      $('#siReg').onclick = () => setGateTab('register', { officeId: o.id });
    } else note.innerHTML = '';
  };
  $('#siRegion').onchange = e => { SI.abbr = e.target.value; SI.officeId = ''; draw(); };
  $('#siSearch').oninput = draw;
  $('#siAdmin').onclick = () => { SI.mode = 'secretariat'; renderSignIn(); };
  $('#siSend').onclick = () => {
    const o = officeById(SI.officeId);
    sendLoginCode(o && o.type === CENTRAL ? { officeId: SI.officeId, email: String(SI.email || '').trim() } : { officeId: SI.officeId });
  };
  draw();
}

async function sendLoginCode(target) {
  const btn = $('#siSend');
  if (target.email !== undefined && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(target.email).trim())) {
    toast('Enter a valid e-mail address.', 'bad'); return;
  }
  btn.disabled = true;
  const label = btn.innerHTML;
  btn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px"></span>Sending…';
  try {
    const res = await api('requestCode', Object.assign({ purpose: 'login' }, target));
    SI.step = 'code';
    SI.sentTo = res.sentTo;
    SI.target = target;
    if (target.email) SI.email = target.email;
    renderSignIn();
    startResendTimer($('#siResend'), res.resendIn);
  } catch (err) {
    btn.disabled = false;
    btn.innerHTML = label;
    toast(err.message, 'bad');
  }
}

function renderSignInCode(body) {
  const o = SI.target && SI.target.officeId ? officeById(SI.target.officeId) : null;
  body.innerHTML =
    '<div class="auth-head">' + tile('mail', 'orange', 'lg') + '<div><div class="h2">Check your <em>e-mail</em></div>' +
    '<p>We sent a 6-digit code to <b>' + esc(SI.sentTo) + '</b>' + (o ? ' for ' + esc(o.short) : '') + '. It works for ' +
    ((S.boot && S.boot.app && S.boot.app.codeMinutes) || 10) + ' minutes.</p></div></div>' +
    '<div id="siCode"></div>' +
    '<button class="btn primary block" id="siVerify">' + ic('key') + 'Sign in</button>' +
    '<div class="row mt-12"><button class="link" id="siChange">' + ic('back') + ' Use another office</button>' +
    '<button class="link right" id="siResend" disabled>Send a new code</button></div>' +
    '<p class="tiny muted mt-12">Tip: the code is also in the e-mail subject. Look in Spam if it does not arrive within a minute.</p>';
  const code = mountCode($('#siCode'), v => verifyLogin(v, code));
  $('#siVerify').onclick = () => verifyLogin(code.value(), code);
  $('#siChange').onclick = () => { SI.step = 'pick'; clearInterval(SI.timer); renderSignIn(); };
  $('#siResend').onclick = () => { SI.step = 'pick'; sendLoginCode(SI.target); };
}

async function verifyLogin(value, code) {
  if (String(value).length !== 6) { toast('Enter all 6 digits.', 'bad'); return; }
  const btn = $('#siVerify');
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px"></span>Checking…';
  try {
    const res = await api('login', Object.assign({ code: value }, SI.target));
    S.token = res.token; S.me = res.me; S.expires = res.expires;
    saveSession();
    clearInterval(SI.timer);
    SI.step = 'pick';
    toast('Welcome, ' + res.me.officeShort + '!', 'ok');
    enterApp(true);
  } catch (err) {
    btn.disabled = false;
    btn.innerHTML = ic('key') + 'Sign in';
    code.shake();
    toast(err.message, 'bad');
  }
}

/* ---------------- register an office ---------------- */
function resetRegistration(preset) {
  Object.keys(RG).forEach(k => delete RG[k]);
  Object.assign(RG, { step: 1, abbr: '', officeId: '', email: '', proof: '', codeSent: false, sentTo: '', focal: '', designation: '',
    mobile: '', memoDate: '', memoRef: '', file: null, confirm: { addressed: false, email: false, signed: false } });
  if (preset && preset.officeId) {
    const o = officeById(preset.officeId);
    if (o) { RG.officeId = o.id; RG.abbr = officeGroup(o); }
  }
}

function renderRegister(preset) {
  if (preset || !RG.step || RG.done) resetRegistration(preset);
  const body = $('#authBody');
  if (RG.done) return;
  const steps = ['Office', 'E-mail', 'Focal person', 'Memorandum'];
  const stepper = '<div class="stepper">' + steps.map((s, i) =>
    '<div class="st ' + (RG.step > i + 1 ? 'done' : RG.step === i + 1 ? 'on' : '') + '"><i></i><span>' + s + '</span></div>').join('') + '</div>';
  const memo = (S.boot && S.boot.memo) || {};
  const o = officeById(RG.officeId);
  const co = !!o && o.type === CENTRAL;      // central office: a personal administrator account

  if (RG.step === 1) {
    body.innerHTML = stepper +
      '<div class="auth-head">' + tile('building', 'orange', 'lg') + '<div><div class="h2">Register your <em>office</em></div>' +
      '<p>One official DPWH e-mail per Regional Office or DEO, named in a memorandum to ' + esc(memo.addressee || 'the Task Force') + '.</p></div></div>' +
      '<div class="field"><label for="rgRegion">Region</label><select class="input" id="rgRegion">' + regionOptions(RG.abbr, false, true) + '</select></div>' +
      '<div class="field"><label>Office</label><div class="input-wrap">' + ic('search') + '<input class="input" id="rgSearch" placeholder="Search Regional Office, DEO or central office"></div></div>' +
      '<div class="office-list" id="rgList"></div><div id="rgNote"></div>' +
      '<button class="btn primary block" id="rgNext" disabled>Next ' + ic('chev') + '</button>';
    const draw = () => {
      $('#rgList').innerHTML = officeList(RG.abbr, $('#rgSearch').value, RG.officeId);
      $$('#rgList .office').forEach(b => { b.onclick = () => { RG.officeId = b.dataset.id; RG.abbr = officeGroup(officeById(RG.officeId)); $('#rgRegion').value = RG.abbr; draw(); }; });
      const sel = officeById(RG.officeId);
      $('#rgNext').disabled = !sel;
      $('#rgNote').innerHTML = !sel ? '' : sel.type === CENTRAL
        ? '<div class="callout">' + ic('shield') + '<div><b>' + esc(sel.short) + '</b> accounts are administrators: every region, targets, corrections and approvals. ' +
          'Each person registers their own DPWH e-mail' + (sel.status === 'ACTIVE' ? '; nobody already approved is replaced.' : '.') + '</div></div>'
        : sel.status === 'ACTIVE'
        ? '<div class="callout">' + ic('info') + '<div>' + esc(sel.short) + ' already has an approved account (' + esc(sel.email) + '). A new memorandum replaces it once it is approved.</div></div>'
        : sel.status === 'PENDING'
          ? '<div class="callout warn">' + ic('clock') + '<div>A registration for ' + esc(sel.short) + ' is already waiting. Sending a new one replaces it.</div></div>' : '';
    };
    $('#rgRegion').onchange = e => { RG.abbr = e.target.value; RG.officeId = ''; draw(); };
    $('#rgSearch').oninput = draw;
    $('#rgNext').onclick = () => { RG.step = 2; renderRegister(); };
    draw();
    return;
  }

  if (RG.step === 2) {
    const domain = (S.boot && S.boot.app && S.boot.app.domain) || 'dpwh.gov.ph';
    const verified = !!RG.proof;
    body.innerHTML = stepper +
      '<div class="auth-head">' + tile('mail', '', 'lg') + '<div><div class="h2">Official <em>e-mail</em></div>' +
      '<p>' + (co ? 'Your own DPWH e-mail. You will sign in with it as an administrator of the ' + esc(o.short) + '.'
        : 'The DPWH e-mail ' + esc(o ? o.short : 'your office') + ' will use for all OKB submissions.') + ' We will send a code to confirm it.</p></div></div>' +
      '<div class="field"><label for="rgEmail">Official DPWH e-mail</label><div class="input-wrap">' + ic('mail') +
      '<input class="input" id="rgEmail" type="email" autocomplete="email" placeholder="' + (co ? 'you' : 'office') + '@' + esc(domain) + '" value="' + esc(RG.email) + '"' + (verified ? ' disabled' : '') + '></div>' +
      '<div class="hint">Must end with @' + esc(domain) + '. A personal Gmail cannot be used.</div></div>' +
      (verified
        ? '<div class="callout ok">' + ic('check') + '<div><b>Confirmed.</b> ' + esc(RG.email) + ' belongs to you. <button class="link" id="rgChangeEmail">Change</button></div></div>'
        : RG.codeSent
          ? '<p class="small muted" style="margin:0 0 4px">Enter the code sent to <b>' + esc(RG.sentTo) + '</b></p><div id="rgCode"></div>' +
            '<button class="btn primary block" id="rgVerify">' + ic('check') + 'Confirm e-mail</button>' +
            '<div class="row mt-8"><button class="link right" id="siResend" disabled>Send a new code</button></div>'
          : '<button class="btn primary block" id="rgSendCode">' + ic('send') + 'Send confirmation code</button>') +
      '<div class="row mt-16"><button class="btn ghost" id="rgBack">' + ic('back') + 'Back</button>' +
      '<button class="btn primary right" id="rgNext"' + (verified ? '' : ' disabled') + '>Next ' + ic('chev') + '</button></div>';
    $('#rgBack').onclick = () => { RG.step = 1; renderRegister(); };
    $('#rgNext').onclick = () => { RG.step = 3; renderRegister(); };
    if (verified) {
      $('#rgChangeEmail').onclick = () => { RG.proof = ''; RG.codeSent = false; renderRegister(); };
      return;
    }
    const sendCode = async () => {
      const email = $('#rgEmail').value.trim().toLowerCase();
      if (!new RegExp('@' + domain.replace(/\./g, '\\.') + '$').test(email)) { toast('Use an official e-mail that ends with @' + domain + '.', 'bad'); $('#rgEmail').classList.add('bad'); return; }
      const b = $('#rgSendCode') || $('#siResend');
      if (b) b.disabled = true;
      try {
        const res = await api('requestCode', { purpose: 'register', email: email });
        RG.email = email; RG.codeSent = true; RG.sentTo = res.sentTo;
        renderRegister();
        startResendTimer($('#siResend'), res.resendIn);
      } catch (err) { if (b) b.disabled = false; toast(err.message, 'bad'); }
    };
    if (!RG.codeSent) { $('#rgSendCode').onclick = sendCode; $('#rgEmail').onkeydown = e => { if (e.key === 'Enter') sendCode(); }; return; }
    $('#siResend').onclick = () => { RG.codeSent = false; sendCode(); };
    $('#rgEmail').oninput = () => { RG.codeSent = false; };
    const code = mountCode($('#rgCode'), v => verifyEmail(v));
    const verifyEmail = async v => {
      if (String(v).length !== 6) return toast('Enter all 6 digits.', 'bad');
      const b = $('#rgVerify'); b.disabled = true;
      try {
        const res = await api('verifyEmail', { email: RG.email, code: v });
        RG.proof = res.proof;
        clearInterval(SI.timer);
        toast('E-mail confirmed.', 'ok');
        renderRegister();
      } catch (err) { b.disabled = false; code.shake(); toast(err.message, 'bad'); }
    };
    $('#rgVerify').onclick = () => verifyEmail(code.value());
    return;
  }

  if (RG.step === 3) {
    body.innerHTML = stepper +
      '<div class="auth-head">' + tile('user', 'orange', 'lg') + '<div><div class="h2">' + (co ? 'Account <em>holder</em>' : 'Focal <em>person</em>') + '</div><p>' +
      (co ? 'The person who will use this administrator account.' : 'Who the Secretariat can call about this office\'s OKB reports.') + '</p></div></div>' +
      '<div class="field"><label for="rgFocal">Full name</label><input class="input" id="rgFocal" autocomplete="name" placeholder="e.g. Engr. Juan A. Dela Cruz" value="' + esc(RG.focal) + '"></div>' +
      '<div class="field"><label for="rgDes">Designation</label><input class="input" id="rgDes" placeholder="e.g. Engineer III, Maintenance Section" value="' + esc(RG.designation) + '"></div>' +
      '<div class="field"><label for="rgMobile">Mobile number</label><div class="input-wrap">' + ic('phone') +
      '<input class="input" id="rgMobile" inputmode="tel" autocomplete="tel" placeholder="0917 123 4567" value="' + esc(RG.mobile) + '"></div></div>' +
      '<div class="row mt-16"><button class="btn ghost" id="rgBack">' + ic('back') + 'Back</button><button class="btn primary right" id="rgNext">Next ' + ic('chev') + '</button></div>';
    $('#rgBack').onclick = () => { saveStep3(); RG.step = 2; renderRegister(); };
    $('#rgNext').onclick = () => {
      saveStep3();
      if (RG.focal.length < 3) return toast('Enter the focal person\'s full name.', 'bad');
      if (RG.designation.length < 2) return toast('Enter the designation.', 'bad');
      if (String(RG.mobile).replace(/\D/g, '').length < 7) return toast('Enter a valid mobile number.', 'bad');
      RG.step = 4; renderRegister();
    };
    return;
  }

  if (RG.step === 4) {
    const maxMb = memo.maxMb || 10;
    body.innerHTML = stepper +
      '<div class="auth-head">' + tile('file', '', 'lg') + '<div><div class="h2">Scanned <em>memorandum</em></div>' +
      '<p>Addressed to <b>' + esc(memo.addressee || '') + '</b>, ' + esc(memo.title || '') + ', naming ' + esc(RG.email) +
      (co ? ' as an administrator account of the ' + esc(o.short) + '.' : ' as the official e-mail.') + '</p></div></div>' +
      '<div class="g2 grid" style="gap:12px"><div class="field"><label for="rgDate">Date of the memo</label><input class="input" id="rgDate" type="date" value="' + esc(RG.memoDate) + '"></div>' +
      '<div class="field"><label for="rgRef">Memo no. (optional)</label><input class="input" id="rgRef" placeholder="e.g. RO6-2026-118" value="' + esc(RG.memoRef) + '"></div></div>' +
      '<div id="rgFile"></div>' +
      '<div class="flabel" style="margin:4px 0 8px">The memorandum…</div>' +
      checkBox('addressed', 'is addressed to ' + esc(memo.addressee || '') + ', ' + esc(memo.title || '')) +
      checkBox('email', co ? 'names <b>' + esc(RG.email) + '</b> as an authorized OKB Portal administrator account of the ' + esc(o.short)
        : 'states <b>' + esc(RG.email) + '</b> as the office\'s official e-mail for OKB submissions') +
      checkBox('signed', 'is signed by the head of ' + esc(o ? o.short : 'the office')) +
      '<button class="link" id="rgSample">' + ic('file') + ' See a sample memorandum</button>' +
      '<div class="row mt-16"><button class="btn ghost" id="rgBack">' + ic('back') + 'Back</button><button class="btn primary right" id="rgNext">Review ' + ic('chev') + '</button></div>';
    drawMemoFile(maxMb);
    $$('.check[data-k]', body).forEach(c => {
      c.onclick = e => { e.preventDefault(); RG.confirm[c.dataset.k] = !RG.confirm[c.dataset.k]; c.classList.toggle('on', RG.confirm[c.dataset.k]); };
    });
    $('#rgSample').onclick = showSampleMemo;
    const save4 = () => { RG.memoDate = $('#rgDate').value; RG.memoRef = $('#rgRef').value.trim(); };
    $('#rgBack').onclick = () => { save4(); RG.step = 3; renderRegister(); };
    $('#rgNext').onclick = () => {
      save4();
      if (!RG.memoDate) return toast('Enter the date of the memorandum.', 'bad');
      if (!RG.file) return toast('Attach the scanned memorandum.', 'bad');
      if (!RG.confirm.addressed || !RG.confirm.email || !RG.confirm.signed) return toast('Tick all three checks for the memorandum.', 'bad');
      RG.step = 5; renderRegister();
    };
    return;
  }

  if (RG.step === 5) {
    body.innerHTML = stepper.replace(/st on/g, 'st done') +
      '<div class="auth-head">' + tile('check', 'orange', 'lg') + '<div><div class="h2">Review and <em>submit</em></div><p>An OKB administrator checks the memorandum before the account works.</p></div></div>' +
      '<div class="review">' +
      rv('Office', o ? o.name : '') + rv(co ? 'Access' : 'Region', co ? 'Administrator · all regions' : (o ? o.region : '')) + rv('Official e-mail', RG.email) +
      rv(co ? 'Account holder' : 'Focal person', RG.focal + ' · ' + RG.designation) + rv('Mobile', RG.mobile) +
      rv('Memorandum', (RG.memoRef ? RG.memoRef + ' · ' : '') + dateLabel(RG.memoDate) + ' · ' + (RG.file ? RG.file.name : '')) + '</div>' +
      '<div class="row"><button class="btn ghost" id="rgBack">' + ic('back') + 'Back</button><button class="btn accent right" id="rgSubmit">' + ic('send') + 'Submit registration</button></div>';
    $('#rgBack').onclick = () => { RG.step = 4; renderRegister(); };
    $('#rgSubmit').onclick = submitRegistration;
  }
}
function fileSize(b) { return b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB' : fmtNum(b / 1048576, 1) + ' MB'; }
function saveStep3() { RG.focal = $('#rgFocal').value.trim(); RG.designation = $('#rgDes').value.trim(); RG.mobile = $('#rgMobile').value.trim(); }
function rv(k, v) { return '<div><span>' + esc(k) + '</span><b>' + esc(v) + '</b></div>'; }
function checkBox(k, html) {
  return '<label class="check' + (RG.confirm[k] ? ' on' : '') + '" data-k="' + k + '"><input type="checkbox"' + (RG.confirm[k] ? ' checked' : '') + '>' +
    '<span class="box">' + ic('check') + '</span><span>' + html + '</span></label>';
}

function drawMemoFile(maxMb) {
  const el = $('#rgFile');
  if (RG.file) {
    el.innerHTML = '<div class="file-chip">' + (RG.file.preview ? '<img class="thumb" alt="" src="' + RG.file.preview + '">' : '<span class="thumb">' + ic('file') + '</span>') +
      '<div class="grow"><b class="small">' + esc(RG.file.name) + '</b><div class="tiny muted">' + fileSize(RG.file.size) + ' · ' + esc(RG.file.kind) + '</div></div>' +
      '<button class="btn ghost sm icon" id="rgRemove" aria-label="Remove">' + ic('trash') + '</button></div>';
    $('#rgRemove').onclick = () => { RG.file = null; drawMemoFile(maxMb); };
    return;
  }
  el.innerHTML = '<label class="drop" id="rgDrop">' + tile('upload', 'orange') + '<b>Attach the scanned memorandum</b>' +
    '<div class="small muted">PDF, JPG or PNG · up to ' + maxMb + ' MB</div>' +
    '<input type="file" id="rgInput" accept="application/pdf,image/jpeg,image/png" hidden></label><div style="height:14px"></div>';
  const take = file => {
    if (!file) return;
    const okType = /pdf|jpe?g|png/i.test(file.type) || /\.(pdf|jpe?g|png)$/i.test(file.name);
    if (!okType) return toast('Use a PDF, JPG or PNG file.', 'bad');
    if (file.size > maxMb * 1048576) return toast('The file is larger than ' + maxMb + ' MB.', 'bad');
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result);
      RG.file = { name: file.name, size: file.size, kind: /pdf/i.test(file.type) || /\.pdf$/i.test(file.name) ? 'PDF' : 'Image',
        base64: dataUrl.split(',')[1], preview: /^data:image/.test(dataUrl) ? dataUrl : '' };
      drawMemoFile(maxMb);
    };
    reader.onerror = () => toast('The file could not be read.', 'bad');
    reader.readAsDataURL(file);
  };
  $('#rgInput').onchange = e => take(e.target.files[0]);
  const drop = $('#rgDrop');
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); take(e.dataTransfer.files[0]); };
}

async function submitRegistration() {
  const b = busy('Sending your registration…', 'Uploading the scanned memorandum');
  try {
    const res = await api('submitRegistration', {
      officeId: RG.officeId, email: RG.email, proof: RG.proof, focalPerson: RG.focal, designation: RG.designation,
      mobile: RG.mobile, memoRef: RG.memoRef, memoDate: RG.memoDate,
      memo: { name: RG.file.name, base64: RG.file.base64 }, confirm: RG.confirm
    });
    b.close();
    const o = officeById(RG.officeId);
    if (o && o.status !== 'ACTIVE') o.status = 'PENDING';
    RG.done = true;
    $('#authBody').innerHTML =
      '<div class="success"><div class="burst"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>' +
      '<div class="h2">Registration <em>sent</em></div>' +
      '<p class="muted">An OKB administrator will check the memorandum of <b>' + esc(res.office) + '</b>. You will get an e-mail at <b>' + esc(res.email) +
      '</b> once it is approved; then you can sign in.</p><p class="tiny soft">Reference no. ' + esc(res.accountId) + '</p>' +
      '<button class="btn primary" id="rgDone">' + ic('key') + 'Back to sign in</button></div>';
    $('#rgDone').onclick = () => setGateTab('signin');
  } catch (err) {
    b.close();
    toast(err.message, 'bad');
    if (err.code === 'CODE') { RG.proof = ''; RG.codeSent = false; RG.step = 2; renderRegister(); }
  }
}

function isAdmin() { return !!S.me && S.me.role === 'ADMIN'; }
function navItems() {
  const items = [
    { id: 'home', label: 'Home', icon: 'home' },
    { id: 'waterways', label: 'Waterways', icon: 'waves' },
    { id: 'output', label: 'Output & Sketch', icon: 'brush' },
    { id: 'photos', label: 'Photo Desk', icon: 'camera' },
    { id: 'register', label: 'Register Waterway', icon: 'route' },
    { id: 'requests', label: 'Requests', icon: 'inbox' },
    { id: 'activity', label: 'Activity', icon: 'activity' }
  ];
  if (isAdmin()) {
    items.push({ id: 'targets', label: 'Targets', icon: 'target', admin: true });
    items.push({ id: 'daily', label: 'Daily photos', icon: 'image', admin: true });
    items.push({ id: 'admin', label: 'Admin console', icon: 'shield', admin: true });
  }
  items.push({ id: 'account', label: 'Account', icon: 'user' });
  return items;
}
/* The four buttons along the bottom of a phone; the rest sit under "More". */
function bottomItems() {
  const all = navItems();
  const want = isAdmin() ? ['home', 'waterways', 'targets', 'daily'] : ['home', 'waterways', 'output', 'photos'];
  return want.map(id => all.find(n => n.id === id)).filter(Boolean);
}
function externalLinks() {
  const l = (S.boot && S.boot.links) || {};
  return [
    l.floodReport ? { label: '24/7 Flood Report', icon: 'drop', href: l.floodReport } : null,
    l.magazine ? { label: 'OKB Magazine', icon: 'book', href: l.magazine } : null,
    l.overview ? { label: 'OKB Overview', icon: 'info', href: l.overview } : null
  ].filter(Boolean);
}
function regionShort(abbr) { return /^[IVX]+(-[AB])?$/.test(abbr || '') ? 'Region ' + abbr : (abbr || ''); }
function roleLabel(me) {
  if (me.role === 'ADMIN') return me.officeType === 'CO' ? 'Central office · administrator' : 'OKB Secretariat · administrator';
  return me.role === 'RO' ? 'Regional Office' : 'District Engineering Office';
}

function enterApp(fresh) {
  hideBoot();
  $('#gate').hidden = true;
  $('#app').hidden = false;
  S.regionAbbr = S.me.role === 'ADMIN' ? (S.regionAbbr || 'ALL') : S.me.abbr;
  renderShell();
  if (fresh || !location.hash || location.hash === '#' || location.hash === '#/') {
    if (location.hash === '#/home') route(); else location.hash = '/home';
  } else route();
  api('me').then(me => {
    const before = JSON.stringify(S.me);
    S.me = Object.assign({}, S.me, me);
    if (JSON.stringify(S.me) === before) return;
    saveSession();
    renderShell();
    setActiveNav(currentRoute().name);
  }).catch(() => {});
  outboxStart();
}

function renderShell() {
  const me = S.me;
  const items = navItems();
  const link = n => '<a href="#/' + n.id + '" data-nav="' + n.id + '"><span class="tile">' + ic(n.icon) + '</span>' + n.label +
    (n.id === 'admin' ? '<span class="badge" id="adminBadge" hidden></span>' : '') + '</a>';
  $('#side').innerHTML =
    '<div class="brand"><span class="logo-tile sm"><img alt="OKB" src="' + OKB.LOGO_OKB + '"></span>' +
    '<span class="logo-tile sm"><img alt="DPWH" src="' + OKB.LOGO_DPWH + '"></span>' +
    '<div><div class="t">OKB <em>PORTAL</em></div><small>Oplan Kontra Baha</small></div></div>' +
    '<nav class="nav">' + items.filter(n => !n.admin && n.id !== 'account').map(link).join('') +
    (isAdmin() ? '<div class="nav-sep">Administrator</div>' + items.filter(n => n.admin).map(link).join('') : '') +
    '<div class="nav-sep">Other OKB tools</div>' +
    externalLinks().map(x => '<a target="_blank" rel="noopener" href="' + esc(x.href) + '"><span class="tile">' + ic(x.icon) + '</span>' + x.label + ic('ext', 'ext') + '</a>').join('') +

    '<div class="me">' + tile(isAdmin() ? 'shield' : 'building', 'orange', 'sm') +
    '<div class="grow" style="min-width:0"><b>' + esc(me.officeShort) + '</b><small>' + esc(me.email) + '</small></div>' +
    '<button class="btn sm icon side-out" id="sideOut" title="Sign out" aria-label="Sign out">' + ic('logout') + '</button></div>';

  $('#topbar').innerHTML =
    '<div class="mobile-brand"><span class="logo-tile sm"><img alt="OKB" src="' + OKB.LOGO_OKB + '"></span><div class="t">OKB <em>PORTAL</em></div></div>' +
    '<div class="office-chip">' + tile(isAdmin() ? 'shield' : 'building', me.role === 'RO' || isAdmin() ? 'orange' : '') +
    '<b>' + esc(me.office) + '</b><small>' + esc(roleLabel(me)) + (me.abbr ? ' · ' + esc(me.abbr) : '') + '</small></div>' +
    '<span class="right"></span>' +
    '<button class="sync-chip" id="syncChip" type="button" hidden></button>' +
    '<button class="btn ghost sm" id="topView" type="button" title="Switch between the plain grey look and the modern look">' + ic('layout') + '<span class="hide-sm"></span></button>' +
    '<button class="btn ghost sm" id="topRefresh" type="button" title="Reload data">' + ic('refresh') + '<span class="hide-sm">Refresh</span></button>';
  $('#topRefresh').onclick = () => { refreshData(); toast('Loading fresh data…'); };
  $('#topView').onclick = () => setSimple(!isSimple());
  $('#syncChip').onclick = () => openOutbox();
  paintViewLabels();
  paintSync();

  $('#bottomNav').innerHTML = bottomItems().map(n => '<a href="#/' + n.id + '" data-nav="' + n.id + '">' + ic(n.icon) +
    '<span>' + ({ output: 'Output', photos: 'Photos', daily: 'Photos' }[n.id] || n.label) + '</span></a>').join('') +
    '<a href="javascript:void(0)" id="navMore" data-nav="more">' + ic('more') + '<span>More</span></a>';

}

/* Forget every saved copy of the data and draw the page again. */
function refreshData() {
  S.region = null; S.cache = {};
  dropSaved();
  route();
}

function setActiveNav(name) {
  const bottom = bottomItems().map(n => n.id);
  const alias = { waterway: 'waterways' }[name] || name;
  const inMore = bottom.indexOf(alias) < 0;
  $$('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === alias || (inMore && a.dataset.nav === 'more')));
}

function openMoreSheet() {
  const bottom = bottomItems().map(n => n.id);
  const items = navItems().filter(n => bottom.indexOf(n.id) < 0);
  const m = openModal({
    title: 'More', icon: 'more',
    body: '<div class="list">' + items.map(n => '<a class="qa" href="#/' + n.id + '" data-go>' + tile(n.icon, n.admin ? 'orange' : '') +
      '<div><b>' + n.label + '</b></div></a>').join('') +
      externalLinks().map(x => '<a class="qa" target="_blank" rel="noopener" href="' + esc(x.href) + '">' + tile(x.icon, 'soft') + '<div><b>' + x.label + '</b><small>Opens in a new tab</small></div>' + ic('ext', 'right') + '</a>').join('') +
      '<button class="qa" id="moreView" style="text-align:left;border:1px solid var(--line)">' + tile('layout', 'soft') + '<div><b>' + viewLabel() + '</b><small>' +
      (isSimple() ? 'Back to the DPWH presentation look' : 'Plain grey look, like a desktop program') + '</small></div></button>' +
      '<button class="qa" id="moreOut" style="text-align:left;border:1px solid var(--line)">' + tile('logout', 'soft') + '<div><b>Sign out</b><small>' + esc(S.me.email) + '</small></div></button></div>'
  });
  $$('[data-go]', m.el).forEach(a => a.addEventListener('click', () => m.close()));
  $('#moreOut', m.el).onclick = () => { m.close(); askSignOut(); };
  $('#moreView', m.el).onclick = () => { m.close(); setSimple(!isSimple()); };
}

async function askSignOut() {
  const waiting = outboxCount();
  const yes = await confirmBox({
    title: 'Sign out?', icon: 'logout', ok: 'Sign out', okKind: 'accent',
    sub: 'You will need a new e-mailed code to sign in again on this device.',
    body: waiting ? '<div class="callout warn">' + ic('clock') + '<div><b>' + waiting + ' submission' + (waiting === 1 ? ' is' : 's are') +
      ' still waiting to be sent.</b> ' + (waiting === 1 ? 'It stays' : 'They stay') + ' on this device and ' + (waiting === 1 ? 'is' : 'are') +
      ' sent when ' + esc(S.me.officeShort) + ' signs in here again.</div></div>' : ''
  });
  if (yes) signOut();
}

/* The count beside "Admin console". Asked for at most once a minute unless forced. */
function refreshAdminBadge(force) {
  const paint = ov => {
    const n = ov.pending.registrations + ov.pending.requests;
    const b = $('#adminBadge');
    if (b) { b.hidden = !n; b.textContent = n; }
  };
  const have = S.cache.adminOverview;
  if (have) paint(have);
  if (!force && have && Date.now() - (have._at || 0) < 60000) return;
  if (S.badgeBusy) return;
  S.badgeBusy = true;
  api('adminOverview').then(ov => { ov._at = Date.now(); S.cache.adminOverview = ov; paint(ov); }).catch(() => {})
    .then(() => { S.badgeBusy = false; });
}

/* Admin region switch (All regions + each region). */
function regionPills(onChange) {
  if (S.me.role !== 'ADMIN') return '';
  const regions = (S.boot && S.boot.regions) || [];
  setTimeout(() => {
    $$('.region-pills button').forEach(b => {
      b.onclick = () => { S.regionAbbr = b.dataset.abbr; S.region = null; onChange ? onChange() : route(); };
    });
  }, 0);
  return '<div class="region-pills">' + ['ALL'].concat(regions.map(r => r.abbr)).map(a =>
    '<button data-abbr="' + esc(a) + '" class="' + ((S.regionAbbr || 'ALL') === a ? 'on' : '') + '">' + (a === 'ALL' ? 'All regions' : esc(a)) + '</button>').join('') + '</div>';
}

/* "National Capital Region (NCR)" → "National Capital Region": the short name is already shown above it. */
function shortRegion(r) {
  const name = String(r.name || '');
  const m = name.match(/^(.*\S)\s*\(([^)]+)\)\s*$/);
  return m && norm(m[2]) === norm(r.abbr) ? m[1] : name;
}

/* Regions as a table that sorts; a click opens the region. */
function mountRegionGrid(el, rows, clickable) {
  if (!el) return;
  const share = r => (r.planned > 0 ? r.accomplished / r.planned * 100 : null);
  const meter = v => v === null ? '<span class="soft">—</span>' : '<div class="row" style="gap:8px;justify-content:flex-end"><div class="bar thin grow ' + barClass(v) + '"><i data-w="' + Math.min(100, v) + '"></i></div><b class="mono small" style="min-width:46px;text-align:right">' + fmtPct(v) + '</b></div>';
  const col = {
    region: { key: 'abbr', label: 'Region', cls: 'nm rg', html: r => esc(r.abbr) + '<small>' + esc(shortRegion(r)) + '</small>' },
    target: { key: 'planned', label: 'Target m³', num: true, html: r => fmtNum(r.planned, 0) },
    done: { key: 'accomplished', label: 'Accomplished m³', num: true, html: r => fmtNum(r.accomplished, 0) },
    share: { key: 'share', label: 'Of target', num: true, w: '132px', sort: share, html: r => meter(share(r)) },
    ww: { key: 'waterways', label: 'Waterways', num: true, html: r => fmtNum(r.waterways, 0) },
    dr: { key: 'drainages', label: 'Drainages', num: true, html: r => fmtNum(r.drainages, 0) },
    avg: { key: 'avgPercent', label: 'Avg. progress', num: true, html: r => fmtPct(r.avgPercent) },
    fin: { key: 'completed', label: 'Completed', num: true, html: r => fmtNum(r.completed, 0) },
    ph: { key: 'photos', label: 'Photos', num: true, html: r => fmtNum(r.photos, 0) }
  };
  /* on a phone or a small screen the progress comes first, so it shows without sliding the table */
  const order = window.innerWidth < 1200 ? ['region', 'share', 'done', 'target', 'ww', 'dr', 'avg', 'fin', 'ph']
    : ['region', 'ww', 'dr', 'target', 'done', 'share', 'avg', 'fin', 'ph'];
  mountGrid(el, order.map(k => col[k]), {
    cls: 'fit', rows: rows, sortKey: 'share', sortDir: -1, empty: 'No waterways yet.',
    onRow: clickable ? r => { S.regionAbbr = r.abbr; S.region = null; route(); } : null,
    after: box => animateBars(box)
  });
}

function kpiCard(kind, icon, label, value, dp, unit, sub) {

    '<div class="label">' + label + '</div></div><div class="num"><span data-count="' + (value || 0) + '" data-dp="' + dp + '">0</span>' +
    (unit ? '<small>' + unit + '</small>' : '') + '</div><div class="sub">' + sub + '</div></div>';
}
function qa(icon, kind, title, sub, href) {
  return '<a class="qa" href="' + href + '">' + tile(icon, kind) + '<div><b>' + title + '</b><small>' + sub + '</small></div></a>';
}
function drawOffices(card, offices, abbr) {

      (o.lastSignIn ? '<div class="tiny muted">Last sign-in ' + esc(dateLabel(o.lastSignIn)) + '</div>' : '') + '</span>' + officeStatusPill(o) + '</div>').join('') + '</div>';

async function drawRegionMap(el, d, ask) {
  if (!el) return;
  let map;
  try { map = await makeMap(el); } catch (err) { return; }
  const byName = {};
  d.waterways.forEach(w => { byName[norm(w.name)] = w; });
  const renderer = L.canvas({ padding: 0.3 });
  let group = null;
  const paint = (data, fit) => {
    if (!document.body.contains(el)) return;
    if (group) group.remove();
    group = L.featureGroup().addTo(map);
    data.lines.forEach(line => {
      const w = byName[norm(line.n)];
      const color = statusColor(w ? w.status : 'NO TARGET');
      line.r.forEach(run => {
        if (run.length < 2) return;
        L.polyline(run, { renderer, color: '#071B45', weight: 7, opacity: .45, interactive: false }).addTo(group);
        const pl = L.polyline(run, { renderer, color, weight: 4, opacity: .95 }).addTo(group);
        pl.bindTooltip('<b>' + esc(titleCase(line.n)) + '</b><br>' + (w ? fmtPct(w.percent) + ' · ' + statusLabel(w.status) : '') +
          '<br><span style="opacity:.8">' + fmtNum(line.c, 0) + ' of ' + fmtNum(line.p, 0) + ' points cleaned</span>', { sticky: true, className: 'okb-tip' });
        pl.on('click', () => go('/waterway/' + encodePath(line.n, line.s)));
      });
    });
    if (fit) {
      const b = group.getBounds();
      if (b.isValid()) map.fitBounds(b, { padding: [24, 24], maxZoom: 15 });
    }
  };
  try {
    const first = await (ask || regionMapData());
    paint(first.data, true);
    /* a saved copy was drawn first: swap in the fresh lines when they arrive */
    if (first.fresh) first.fresh.then(data => { if (data) paint(data, false); }).catch(() => {});
  } catch (err) {
    toast('Map: ' + err.message, 'bad');
  }
}

function activityList(list) {
  if (!list.length) return '<div class="empty small">Nothing here yet.</div>';
  const iconOf = a => ({ OUTPUT: 'brush', PHOTOS: 'camera', 'NEW WATERWAY': 'route', EXTENSION: 'route', REGISTRATION: 'building', 'SIGN IN': 'key',
    TARGET: 'target', 'TARGET CLEARED': 'target', 'EDITED ENTRY': 'edit' }[a] ||
    (/APPROVED/.test(a) ? 'check' : /DELETED/.test(a) ? 'trash' : /REJECTED|REVOKED/.test(a) ? 'x' : 'activity'));
  return '<div class="timeline">' + list.map(a => '<div class="tl">' + tile(iconOf(a.action), /OUTPUT|PHOTOS/.test(a.action) ? 'orange' : 'soft', 'sm') +

    '<div class="chips" id="wfStatus">' + [['', 'Any status'], ['ONGOING', 'Ongoing'], ['COMPLETED', 'Completed'], ['NOT YET STARTED', 'Not started'], ['NO TARGET', 'No target']].map(x =>
      '<button class="chip' + (WF.status === x[0] ? ' on' : '') + '" data-v="' + x[0] + '">' + x[1] + '</button>').join('') + '</div></div>' +
    '<div class="list" id="wfList"></div>';
  const open = w => go('/waterway/' + encodePath(w.name, w.site));
  const draw = () => {
    const q = norm(WF.q);
    const items = d.waterways.filter(w => (!q || norm(w.name).includes(q) || norm(w.site).includes(q)) &&
      (!WF.type || w.type === WF.type) && (!WF.status || w.status === WF.status) && (!WF.site || w.site === WF.site))
      .sort((a, b) => (b.percent === null ? -1 : b.percent) - (a.percent === null ? -1 : a.percent) || a.name.localeCompare(b.name));
    const box = $('#wfList', el);
    setStatus(items.length === d.waterways.length ? 'Click a row to open the waterway.' : 'Showing ' + items.length + ' of ' + d.waterways.length + '. Click a row to open it.', [
      ['Shown', fmtNum(items.length, 0)], ['Completed', fmtNum(items.filter(w => w.status === 'COMPLETED').length, 0)],
      ['Ongoing', fmtNum(items.filter(w => w.status === 'ONGOING').length, 0)],
      ['No target', fmtNum(items.filter(w => w.status === 'NO TARGET').length, 0), items.some(w => w.status === 'NO TARGET') ? 'warn' : '']]);
    if (isSimple()) {
      box.className = '';
      waterwayGrid(box, items, d.abbr === 'ALL', open, true);
      return;
    }
    box.className = 'list';
    box.innerHTML = items.length ? items.slice(0, 300).map(w =>
      '<div class="ww" data-w="' + esc(w.name) + '" data-s="' + esc(w.site) + '">' + tile(w.type === 'Drainage' ? 'route' : 'waves', w.type === 'Drainage' ? 'orange' : '') +
      '<div style="min-width:0"><div class="t">' + esc(titleCase(w.name)) + '</div><div class="meta"><span>' + esc(w.site) + '</span>' +
      (d.abbr === 'ALL' ? '<span class="pill navy">' + esc(w.abbr) + '</span>' : '') +
      '<span class="pill ' + statusClass(w.status) + '">' + statusLabel(w.status) + '</span>' + pendingPill(w.name) +
      (w.photos ? '<span>' + ic('camera') + ' ' + w.photos + '</span>' : '') + (w.lastUpdate ? '<span>Updated ' + esc(dateLabel(w.lastUpdate)) + '</span>' : '') + '</div>' +
      '<div class="bar thin ' + barClass(w.percent) + '"><i data-w="' + Math.min(100, w.percent || 0) + '"></i></div></div>' +
      '<div class="pct">' + fmtPct(w.percent) + '<small>' + (w.planned ? fmtNum(w.accomplished, 0) + ' / ' + fmtNum(w.planned, 0) + ' m³' : (w.accomplished ? fmtNum(w.accomplished, 0) + ' m³' : 'no target')) + '</small></div></div>').join('') +
      (items.length > 300 ? '<div class="empty small">Showing the first 300. Search or filter to narrow the list.</div>' : '')
      : '<div class="empty">' + tile('search', 'soft', 'lg') + 'No waterway matches these filters.</div>';
    $$('.ww', el).forEach(r => { r.onclick = () => go('/waterway/' + encodePath(r.dataset.w, r.dataset.s)); });
    animateBars(el);
  };
  const later = debounce(draw, 140);
  $('#wfQ', el).oninput = e => { WF.q = e.target.value; later(); };
  $('#wfSite', el).onchange = e => { WF.site = e.target.value; draw(); };
  $$('#wfType .chip', el).forEach(c => { c.onclick = () => { WF.type = c.dataset.v; $$('#wfType .chip', el).forEach(x => x.classList.toggle('on', x === c)); draw(); }; });
  $$('#wfStatus .chip', el).forEach(c => { c.onclick = () => { WF.status = c.dataset.v; $$('#wfStatus .chip', el).forEach(x => x.classList.toggle('on', x === c)); draw(); }; });
  draw();
};

/* Waterways as a table that sorts (the Simple view's list). */
function waterwayGrid(box, items, withRegion, onPick, full) {
  const cols = [
    { key: 'name', label: 'Name of waterway', cls: 'nm', html: w => esc(w.name) + pendingPill(w.name) },
    { key: 'site', label: 'Site' }
  ];
  if (withRegion) cols.push({ key: 'abbr', label: 'Region', cls: 'nw' });
  cols.push({ key: 'type', label: 'Type' });
  cols.push({ key: 'status', label: 'Status', cls: 'nw', html: w => '<span class="pill ' + statusClass(w.status) + '">' + statusLabel(w.status) + '</span>' });
  if (full) {
    cols.push({ key: 'planned', label: 'Target m³', num: true, html: w => w.planned === null ? '<span class="soft">—</span>' : fmtNum(w.planned, 0) });
    cols.push({ key: 'accomplished', label: 'Accomplished m³', num: true, html: w => w.accomplished === null ? '<span class="soft">—</span>' : fmtNum(w.accomplished, 0) });
  }
  cols.push({ key: 'percent', label: 'Progress', num: true, w: '150px', html: w => w.percent === null ? '<span class="soft">—</span>'
    : '<div class="row" style="gap:6px;justify-content:flex-end"><div class="bar thin grow ' + barClass(w.percent) + '"><i data-w="' + Math.min(100, w.percent) + '"></i></div><span style="min-width:44px;text-align:right">' + fmtPct(w.percent) + '</span></div>' });
  if (full) {
    cols.push({ key: 'photos', label: 'Photos', num: true, html: w => w.photos ? fmtNum(w.photos, 0) : '' });
    cols.push({ key: 'lastUpdate', label: 'Last update', cls: 'nw', html: w => w.lastUpdate ? esc(dateLabel(w.lastUpdate)) : '' });
  }
  return mountGrid(box, cols, {
    rows: items, limit: 200, empty: 'No waterway matches.', onRow: onPick,
    sortKey: full ? 'percent' : 'name', sortDir: full ? -1 : 1, after: b => animateBars(b)
  });
}

/* Joins neighbouring stretches of the same colour into one line each, so a
   long waterway is a few lines on the map instead of thousands. */
function cleanRuns(pts, segs) {
  const runs = [];
  let cur = null;
  segs.forEach(s => {
    if (cur && cur.cleaned === s.cleaned && cur.last === s.a) {
      cur.ll.push([pts[s.b].lat, pts[s.b].lng]);
      cur.last = s.b;
    } else {
      cur = { cleaned: s.cleaned, last: s.b, ll: [[pts[s.a].lat, pts[s.a].lng], [pts[s.b].lat, pts[s.b].lng]] };
      runs.push(cur);
    }
  });
  return runs;
}
