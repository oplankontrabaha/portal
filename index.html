    if (isChanged(it)) {
      if (p.clear) return '<span class="tgt-note new">Target will be removed</span>';
      return '<span class="tgt-note new">' + (p.sum ? '= ' + fmtNum(p.value) + ' m³ · ' : '') + (it.listed ? 'was ' + (it.target === null ? 'blank' : fmtNum(it.target)) : 'will be added to the plan tab') + '</span>';
    }
    if (p.sum) return '<span class="tgt-note">= ' + fmtNum(p.value) + ' m³</span>';
    if (it.formula) return '<span class="tgt-note" title="' + esc(it.formula) + '">worked out by a sheet formula</span>';
    if (it.planName) return '<span class="tgt-note" title="Plan tab: ' + esc(it.planName) + '">plan tab: ' + esc(it.planName.length > 30 ? it.planName.slice(0, 29) + '…' : it.planName) + '</span>';
    if (!it.listed) return '<span class="tgt-note">' + (it.planned ? 'log shows ' + fmtNum(it.planned) + ' m³ · ' : '') + 'not on the plan tab</span>';
    return '<span class="tgt-note"></span>';
  };
  const cell = it => {
    const raw = TG.edits[it.key] !== undefined ? TG.edits[it.key] : targetPretty(targetOriginal(it));
    const p = parseTargetText(raw);
    return '<div class="tgt-cell"><input class="tgt' + (isChanged(it) ? ' dirty' : '') + (p.ok ? '' : ' bad') + '" data-k="' + esc(it.key) + '" inputmode="decimal" autocomplete="off" ' +
      'aria-label="Target volume of ' + esc(it.name) + ' in cubic metres" placeholder="no target" value="' + esc(raw) + '">' +
      '<button type="button" class="tgt-x" data-x="' + esc(it.key) + '" title="Remove this target"' + (raw ? '' : ' disabled') + ' aria-label="Remove the target of ' + esc(it.name) + '">' + ic('x') + '</button></div>' +
      '<span data-note="' + esc(it.key) + '">' + note(it) + '</span>';
  };
  const progress = it => {
    const t = valueNow(it);
    if (!t || it.accomplished === null) return '<span class="soft">—</span>';
    const pct = it.accomplished / t * 100;
    return '<div class="row" style="gap:6px;justify-content:flex-end"><div class="bar thin grow ' + barClass(pct) + '"><i style="width:' + Math.min(100, pct) + '%"></i></div><span style="min-width:48px;text-align:right">' + fmtPct(pct) + '</span></div>';
  };
  /* on a phone the region joins the name, so the box to type in shows without sliding the table */
  const narrow = window.innerWidth < 700;
  const cols = [
    { key: 'name', label: 'Name of waterway', cls: 'nm', html: it => esc(it.name) + '<small>' + esc(it.site) + (all && narrow ? ' · ' + esc(it.abbr) : all ? '' : ' · ' + esc(it.type)) + '</small>' }
  ];
  if (all && !narrow) cols.push({ key: 'abbr', label: 'Region', cls: 'nw' });
  cols.push({ key: 'target', label: 'Target m³', num: true, w: narrow ? '146px' : '230px', sort: it => valueNow(it), html: cell });
  cols.push({ key: 'accomplished', label: 'Accomplished m³', num: true, html: it => it.accomplished === null ? '<span class="soft">—</span>' : fmtNum(it.accomplished) });
  cols.push({ key: 'percent', label: 'Progress', num: true, w: '160px', sort: it => { const t = valueNow(it); return t && it.accomplished !== null ? it.accomplished / t * 100 : null; },
    html: it => '<span data-prog="' + esc(it.key) + '">' + progress(it) + '</span>' });

  let grid = null;
  const visible = () => {
    const q = norm(TG.q);
    return d.items.filter(it => (!q || norm(it.name).includes(q) || norm(it.site).includes(q)) &&
      (TG.show === 'all' || (TG.show === 'none' && valueNow(it) === null) || (TG.show === 'with' && valueNow(it) !== null) || (TG.show === 'changed' && isChanged(it))));
  };
  const changedList = () => d.items.filter(isChanged);
  const paintStats = () => {
    let withT = 0, total = 0, acc = 0;
    d.items.forEach(it => { const v = valueNow(it); if (v !== null) { withT++; total += v; } if (it.accomplished > 0) acc += it.accomplished; });
    $('#tgStats', el).innerHTML = statBox('Waterways', fmtNum(d.items.length, 0), '') + statBox('With a target', fmtNum(withT, 0), '') +
      statBox('No target yet', fmtNum(d.items.length - withT, 0), '') + statBox('Total target', fmtNum(total, 0), 'm³');
    const ch = changedList();
    setStatus(ch.length ? ch.length + ' target' + (ch.length === 1 ? '' : 's') + ' changed, not saved yet.' : 'Type in the Target column, then Save.', [
      ['Waterways', fmtNum(d.items.length, 0)], ['No target', fmtNum(d.items.length - withT, 0), d.items.length - withT ? 'warn' : ''],
      ['Total target', fmtNum(total, 0) + ' m³'], ['Accomplished', fmtNum(acc, 0) + ' m³'], ['Unsaved', String(ch.length), ch.length ? 'warn' : '']]);
  };
  const paintChips = () => {
    const n = changedList().length;
    $('#tgShow', el).innerHTML = [['all', 'All'], ['none', 'No target'], ['with', 'With a target'], ['changed', 'Changed' + (n ? ' (' + n + ')' : '')]].map(x =>
      '<button class="chip' + (TG.show === x[0] ? ' on' : '') + '" data-v="' + x[0] + '">' + x[1] + '</button>').join('');
    $$('#tgShow .chip', el).forEach(c => { c.onclick = () => { TG.show = c.dataset.v; paintChips(); grid.setRows(visible()); }; });
  };
  const paintBar = () => {
    const ch = changedList();
    const bad = ch.filter(it => !parseTargetText(typed(it)).ok).length;
    const bar = $('#tgBar', el);
    bar.hidden = !ch.length;
    if (!ch.length) return;
    bar.innerHTML = '<div class="card">' + tile('target', 'orange', 'sm') + '<div class="grow"><b>' + ch.length + ' target' + (ch.length === 1 ? '' : 's') + ' changed</b>' +
      '<div class="small ' + (bad ? '' : 'muted') + '"' + (bad ? ' style="color:var(--bad)"' : '') + '>' +
      (bad ? 'Fix the ' + bad + ' in red before saving' : 'Not saved yet. Nothing changes in the SSOT until you save.') + '</div></div>' +
      '<button class="btn ghost" id="tgDiscard">' + ic('undo') + 'Discard</button>' +
      '<button class="btn accent" id="tgSave"' + (bad ? ' disabled' : '') + '>' + ic('save') + 'Review and save</button></div>';
    $('#tgDiscard', el).onclick = async () => {
      if (!await confirmBox({ title: 'Discard the changes?', sub: ch.length + ' typed target' + (ch.length === 1 ? '' : 's') + ' will go back to what the SSOT has.', icon: 'undo', ok: 'Discard', okKind: 'accent' })) return;
      d.items.forEach(it => { delete TG.edits[it.key]; });      // what was typed for another region stays
      if (TG.show === 'changed') TG.show = 'all';
      route();
    };
    $('#tgSave', el).onclick = () => reviewTargets(ch, typed, d);
  };
  const onEdit = (it, input) => {
    const raw = input.value;
    if (targetCanon(raw) === targetCanon(targetOriginal(it))) delete TG.edits[it.key]; else TG.edits[it.key] = raw;
    const p = parseTargetText(raw);
    input.classList.toggle('bad', !p.ok);
    input.classList.toggle('dirty', isChanged(it));
    const tr = input.closest('tr');
    if (tr) tr.classList.toggle('changed', isChanged(it));
    const n = $('[data-note="' + CSS.escape(it.key) + '"]', el);
    if (n) n.innerHTML = note(it);
    const pr = $('[data-prog="' + CSS.escape(it.key) + '"]', el);
    if (pr) pr.innerHTML = progress(it);
    const x = $('[data-x="' + CSS.escape(it.key) + '"]', el);
    if (x) x.disabled = !raw;
    paintStats(); paintBar();
    const chip = $('#tgShow [data-v="changed"]', el);
    if (chip) { const c = changedList().length; chip.textContent = 'Changed' + (c ? ' (' + c + ')' : ''); }
  };
  grid = mountGrid($('#tgGrid', el), cols, {
    rows: visible(), limit: 150, sortKey: 'name', sortDir: 1, empty: 'No waterway matches.',
    rowCls: it => (isChanged(it) ? 'changed' : ''),
    after: box => {
      const inputs = $$('input.tgt', box);
      inputs.forEach((input, i) => {
        const it = byKey[input.dataset.k];
        input.oninput = () => onEdit(it, input);
        input.onfocus = () => { if (TG.edits[it.key] === undefined) { input.value = targetOriginal(it); } input.select(); };
        input.onblur = () => { if (TG.edits[it.key] === undefined) input.value = targetPretty(targetOriginal(it)); };
        input.onkeydown = e => {
          if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); const nx = inputs[i + 1]; if (nx) nx.focus(); }
          if (e.key === 'ArrowUp') { e.preventDefault(); const pv = inputs[i - 1]; if (pv) pv.focus(); }
          if (e.key === 'Escape') { delete TG.edits[it.key]; input.value = targetOriginal(it); onEdit(it, input); }
        };
      });
      $$('.tgt-x', box).forEach(b => {
        b.onclick = () => {
          const it = byKey[b.dataset.x];
          const input = $('input.tgt[data-k="' + CSS.escape(it.key) + '"]', box);
          input.value = '';
          onEdit(it, input);
          input.focus();
        };
      });
    }
  });
  const later = debounce(() => grid.setRows(visible()), 140);
  $('#tgQ', el).oninput = e => { TG.q = e.target.value; later(); };
  paintChips(); paintStats(); paintBar();
};

/* Rows of the plan tab the portal cannot place (nationwide view only: they have no region). */
function planCheckNote(d, all) {
  const c = d.planCheck;
  if (!all || !c || (!c.unmatched && !(c.twice && c.twice.length))) return '';
  const bits = [];
  if (c.unmatched) {
    bits.push('<b>' + c.unmatched + ' row' + (c.unmatched === 1 ? '' : 's') + ' of the plan tab match' + (c.unmatched === 1 ? 'es' : '') + ' no waterway in the list</b>, so ' +
      (c.unmatched === 1 ? 'its' : 'their') + ' figures are in nobody\'s totals here: ' + fmtNum(c.target, 0) + ' m³ target and ' + fmtNum(c.accomplished, 0) + ' m³ accomplished.');
  }
  if (c.twice && c.twice.length) {
    bits.push('<b>Listed twice on the plan tab:</b> ' + esc(c.twice.slice(0, 3).join(', ')) + (c.twice.length > 3 ? ' and ' + (c.twice.length - 3) + ' more' : '') + '. The first row is used.');
  }
  return '<div class="callout warn" id="tgCheck">' + ic('alert') + '<div class="small grow">' + bits.join(' ') +
    ' <button class="link" id="tgPlanCheck" style="padding:0;font-size:inherit">Show the list</button></div></div>';
}
function openPlanCheck(c) {
  const rows = c.rows || [];
  const m = openModal({
    title: 'Plan tab check', icon: 'alert', iconKind: 'orange', wide: true,
    sub: 'Usually a name spelled differently on the plan tab than in the waterway list (SitevsWaterway). Make the two names the same in the SSOT and the row joins its waterway.',
    body: (rows.length ? '<div id="pcGrid"></div>' +
        (c.unmatched > rows.length ? '<div class="tiny muted mt-8">The ' + rows.length + ' largest of ' + c.unmatched + ' are shown.</div>' : '') : '') +
      (c.blank ? '<div class="small muted mt-8">' + c.blank + ' more unmatched row' + (c.blank === 1 ? ' has' : 's have') + ' no target and no accomplished volume, so nothing is missing from the totals.</div>' : '') +
      (c.twice && c.twice.length ? '<div class="callout mt-12" style="margin-bottom:0">' + ic('info') + '<div class="small"><b>Listed twice (the first row is used):</b> ' + esc(c.twice.join(', ')) + '</div></div>' : ''),
    actions: [{ label: 'Close', kind: 'ghost', onClick: () => true }]
  });
  const box = $('#pcGrid', m.el);
  if (box) {
    mountGrid(box, [
      { key: 'name', label: 'Name on the plan tab', cls: 'nm', html: r => esc(r.name) + '<small>Row ' + r.row + '</small>' },
      { key: 'target', label: 'Target m³', num: true, html: r => r.target === null ? '<span class="soft">—</span>' : fmtNum(r.target, 2) },
      { key: 'accomplished', label: 'Accomplished m³', num: true, html: r => r.accomplished === null ? '<span class="soft">—</span>' : fmtNum(r.accomplished, 2) }
    ], { rows: rows, limit: 60, sortKey: 'target', sortDir: -1, empty: 'Nothing to show.' });
  }
}

function reviewTargets(changed, typed, d) {
  const rows = changed.map(it => {
    const p = parseTargetText(typed(it));
    return { it: it, p: p };
  });
  const m = openModal({
    title: 'Save ' + rows.length + ' target' + (rows.length === 1 ? '' : 's') + '?', icon: 'target', iconKind: 'orange', wide: rows.length > 4,
    sub: 'Written to planned_volume_office on the plan tab of the OKB SSOT.',
    body: '<div class="table-wrap" style="max-height:44vh;overflow:auto"><table class="table"><thead><tr><th>Waterway</th><th>Now</th><th>New target</th></tr></thead><tbody>' +
      rows.map(r => '<tr><td><b>' + esc(r.it.name) + '</b><div class="tiny muted">' + esc(r.it.site) + ' · ' + esc(r.it.abbr) + (r.it.listed ? '' : ' · will be added to the plan tab') + '</div></td>' +
        '<td class="mono"><span class="diff-old">' + (r.it.target === null ? 'no target' : fmtNum(r.it.target) + ' m³') + '</span></td>' +
        '<td class="mono"><span class="diff-new">' + (r.p.clear ? 'no target' : fmtNum(r.p.value) + ' m³') + '</span>' + (r.p.sum ? '<div class="tiny muted">' + esc(targetPretty(r.p.sum)) + '</div>' : '') + '</td></tr>').join('') +
      '</tbody></table></div>' +
      '<div class="field mt-12"><label for="tgRem">Remarks (optional, kept in the activity log)</label><input class="input" id="tgRem" maxlength="300" placeholder="e.g. Revised program of works, November 2026"></div>',
    actions: [{ label: 'Save to the SSOT', kind: 'accent', icon: 'save', id: 'tgConfirm', onClick: async (mm, b) => {
      b.disabled = true;
      const bb = busy('Saving the targets…', 'Writing to the plan tab of the OKB SSOT');
      try {
        const res = await api('adminSetTargets', {
          items: rows.map(r => ({ name: r.it.name, site: r.it.site, value: r.p.clear ? '' : (r.p.sum || String(r.p.value)) })),
          remarks: $('#tgRem', mm.el).value
        });
        bb.close();
        rows.forEach(r => { delete TG.edits[r.it.key]; });       // what was typed for another region stays
        if (TG.show === 'changed') TG.show = 'all';
        S.region = null; S.cache = {};
        dropSaved();
        toast(res.changed + ' target' + (res.changed === 1 ? '' : 's') + ' saved' + (res.added ? ' · ' + res.added + ' added to the plan tab' : '') + '.', 'ok');
        route();
      } catch (err) { bb.close(); b.disabled = false; toast(err.message, 'bad'); return false; }
    } }]
  });
  return m;
}

/* One waterway's target, from its own page. */
function editTargetModal(w, onSaved) {
  const original = w.targetSum || (w.target === null || w.target === undefined ? '' : String(w.target));
  const m = openModal({
    title: (w.target === null ? 'Enter the' : 'Change the') + ' <em>target</em>', sub: esc(w.name) + ' · ' + esc(w.site), icon: 'target', iconKind: 'orange',
    body: '<div class="field"><label for="etVal">Target volume</label><div class="input-wrap"><input class="input" id="etVal" inputmode="decimal" autocomplete="off" style="padding-left:14px;padding-right:48px" ' +
      'placeholder="e.g. 73700 or 68700+70095" value="' + esc(original) + '"><span class="input-suffix">m³</span></div>' +
      '<div class="hint" id="etHint"></div></div>' +
      (w.listed ? '' : '<div class="callout">' + ic('info') + '<div class="small">This waterway is not on the plan tab yet. Saving adds it there' +
        (w.accomplished ? ' with its accomplished volume of ' + fmtNum(w.accomplished) + ' m³' : '') + '.</div></div>') +
      '<div class="field"><label for="etRem">Remarks (optional)</label><input class="input" id="etRem" maxlength="300" placeholder="e.g. Revised program of works"></div>',
    actions: [
      w.target !== null ? { label: 'Remove target', kind: 'danger', icon: 'trash', close: false, onClick: mm => { $('#etVal', mm.el).value = ''; paint(); return false; } } : null,
      { label: 'Save target', kind: 'accent', icon: 'save', id: 'etSave', onClick: async (mm, b) => {
        const p = parseTargetText($('#etVal', mm.el).value);
        if (!p.ok) { toast(p.error + '.', 'bad'); return false; }
        if (targetCanon($('#etVal', mm.el).value) === targetCanon(original)) { toast('The target is the same as before.', ''); return false; }
        b.disabled = true;
        try {
          const res = await api('adminSetTargets', { items: [{ name: w.name, site: w.site, value: p.clear ? '' : (p.sum || String(p.value)) }], remarks: $('#etRem', mm.el).value });
          S.region = null; dropSaved();
          toast(res.changed ? (p.clear ? 'Target removed.' : 'Target saved: ' + fmtNum(p.value) + ' m³.') : 'Nothing changed.', 'ok');
          if (onSaved) onSaved();
        } catch (err) { b.disabled = false; toast(err.message, 'bad'); return false; }
      } }
    ].filter(Boolean)
  });
  const paint = () => {
    const raw = $('#etVal', m.el).value;
    const p = parseTargetText(raw);
    const hint = $('#etHint', m.el);
    $('#etVal', m.el).classList.toggle('bad', !p.ok);
    hint.style.color = p.ok ? '' : 'var(--bad)';
    hint.textContent = !p.ok ? p.error + '.' : p.clear ? 'Blank means no target: the waterway shows as "No target".'
      : (p.sum ? targetPretty(p.sum) + ' = ' : '') + fmtNum(p.value) + ' m³' + (w.accomplished ? ' · progress would be ' + fmtPct(w.accomplished / p.value * 100) : '');
  };
  $('#etVal', m.el).oninput = paint;
  $('#etVal', m.el).onkeydown = e => { if (e.key === 'Enter') $('#etSave', m.el).click(); };
  paint();
  setTimeout(() => { const i = $('#etVal', m.el); if (i) { i.focus(); i.select(); } }, 200);
  return m;
}

/* ---------------- volume entries: correct or delete ---------------- */
function entryModal(w, entry, action, onSaved) {
  const what = (entry.mode === 'by' ? 'Added ' : 'Set to ') + fmtNum(entry.volume) + ' m³';
  const facts = '<div class="review">' + rv('Waterway', w.name) + rv('Entry', what) + rv('Date', dateLabel(entry.at)) + rv('Sent by', entry.by || '—') +
    rv('Total after it', fmtNum(entry.total) + ' m³') + '</div>';
  const reasonField = '<div class="field"><label for="enReason">Reason (kept with the records' + (entry.by ? ' and e-mailed to the office' : '') + ')</label>' +
    '<textarea class="input" id="enReason" maxlength="300" placeholder="' + (action === 'DELETE' ? 'e.g. Entered for the wrong waterway' : 'e.g. Typing error: 5,250 was typed as 52,500') + '"></textarea></div>';
  const send = async (mm, b, payload, doneText) => {
    const reason = $('#enReason', mm.el).value.trim();
    if (reason.length < 5) { toast('Write the reason for this change.', 'bad'); $('#enReason', mm.el).focus(); return false; }
    b.disabled = true;
    try {
      const res = await api('adminChangeEntry', Object.assign({ name: w.name, site: w.site, row: entry.row, key: entry.key, reason: reason }, payload));
      S.region = null; dropSaved();
      toast(doneText + ' The total is now ' + (res.total === null ? 'blank' : fmtNum(res.total) + ' m³') + '.', 'ok');
      if (onSaved) onSaved();
    } catch (err) {
      b.disabled = false;
      toast(err.message, 'bad');
      if (err.code === 'STALE') { mm.close(); if (onSaved) onSaved(); }
      return false;
    }
  };
  if (action === 'DELETE') {
    return openModal({
      title: 'Delete this <em>entry</em>?', sub: 'The totals of ' + esc(w.name) + ' are worked out again without it.', icon: 'trash',
      body: facts + '<div class="callout warn">' + ic('alert') + '<div class="small">The row leaves the Accomplishment Log. A copy is kept in the registry\'s “Deleted Items” tab.</div></div>' + reasonField,
      actions: [{ label: 'Delete entry', kind: 'danger', icon: 'trash', id: 'enGo', onClick: (mm, b) => send(mm, b, { action: 'DELETE' }, 'Entry deleted.') }]
    });
  }
  let mode = entry.mode === 'by' ? 'by' : 'to';
  const m = openModal({
    title: 'Correct this <em>entry</em>', sub: esc(w.name) + ' · ' + esc(dateLabel(entry.at)), icon: 'edit', iconKind: 'orange',
    body: facts + '<div class="seg block" id="enMode" style="margin-bottom:12px"><button data-v="to" class="' + (mode === 'to' ? 'on' : '') + '">Set the total</button>' +
      '<button data-v="by" class="' + (mode === 'by' ? 'on' : '') + '">Add to the total</button></div>' +
      '<div class="field"><label for="enVol">Correct volume</label><div class="input-wrap"><input class="input" id="enVol" type="number" inputmode="decimal" min="0" step="0.01" style="padding-left:14px;padding-right:48px" value="' + esc(entry.volume) + '">' +
      '<span class="input-suffix">m³</span></div><div class="hint">Entries after this one are added up again, so every total stays right.</div></div>' + reasonField,
    actions: [{ label: 'Save correction', kind: 'accent', icon: 'save', id: 'enGo', onClick: (mm, b) => {
      const raw = $('#enVol', mm.el).value;
      const v = raw === '' ? NaN : Number(raw);
      if (!isFinite(v) || v < 0) { toast('Enter the volume in cubic metres.', 'bad'); return false; }
      if (mode === 'by' && v === 0) { toast('“Add to the total” needs a volume above zero.', 'bad'); return false; }
      return send(mm, b, { action: 'EDIT', mode: mode, value: v }, 'Entry corrected.');
    } }]
  });
  $$('#enMode button', m.el).forEach(b => { b.onclick = () => { mode = b.dataset.v; $$('#enMode button', m.el).forEach(x => x.classList.toggle('on', x === b)); }; });
  return m;
}

/* ---------------- deleting a wrong photo ---------------- */
function deletePhotoModal(p, done) {
  const quick = ['Wrong waterway', 'Not a site photo', 'Duplicate photo', 'Blurred or unusable'];
  const m = openModal({
    title: 'Delete this <em>photo</em>?', icon: 'trash', sub: esc(p.name || '') + (p.file ? ' · ' + esc(p.file) : ''),
    body: '<div class="callout warn">' + ic('alert') + '<div class="small">It leaves the OKB photo list and the OKB Magazine, and its file goes to the Google Drive trash. ' +
      'A copy of the row is kept in the registry\'s “Deleted Items” tab.</div></div>' +
      '<div class="field"><label for="dpReason">Reason</label><div class="chips" style="margin-bottom:8px">' + quick.map(q => '<button type="button" class="chip" data-q="' + esc(q) + '">' + esc(q) + '</button>').join('') + '</div>' +
      '<input class="input" id="dpReason" maxlength="300" placeholder="Why is this photo being deleted?"></div>',
    actions: [{ label: 'Delete photo', kind: 'danger', icon: 'trash', id: 'dpGo', onClick: async (mm, b) => {
      const reason = $('#dpReason', mm.el).value.trim();
      if (reason.length < 5) { toast('Pick or write the reason.', 'bad'); return false; }
      b.disabled = true;
      try {
        const res = await api('adminDeletePhoto', { url: p.url, row: p.row, reason: reason });
        if (p.name) dropWaterwayCache(p.name);
        S.region = null; dropSaved();
        toast(res.trashed ? 'Photo deleted. Its file is in the Drive trash.' : 'Photo removed from the list. Its file could not be moved to the trash.', 'ok');
        if (done) done();
      } catch (err) {
        b.disabled = false;
        toast(err.message, 'bad');
        if (err.code === 'STALE') { mm.close(); if (done) done(); }
        return false;
      }
    } }]
  });
  $$('[data-q]', m.el).forEach(c => { c.onclick = () => { $('#dpReason', m.el).value = c.dataset.q; $$('[data-q]', m.el).forEach(x => x.classList.toggle('on', x === c)); }; });
  return m;
}

/* ---------------- DAILY PHOTOS ---------------- */
const DP = { view: 'pictures', abbr: '', q: '' };
function dayParts(iso) {
  const d = new Date(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)));
  return {
    wd: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getUTCDay()],
    long: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][d.getUTCDay()], day: d.getUTCDate()
  };
}
function timeLabel(stamp) {
  const m = String(stamp || '').match(/ (\d{1,2}):(\d{2})/);
  if (!m) return '';
  const h = +m[1];
  return ((h % 12) || 12) + ':' + m[2] + ' ' + (h < 12 ? 'AM' : 'PM');
}

ROUTES.daily = async (el, args) => {
  if (!isAdmin()) { go('/home'); return; }
  const asked = /^\d{4}-\d{2}-\d{2}$/.test(args[0] || '') ? args[0] : '';
  el.innerHTML = '<div class="card"><div class="skel" style="height:380px"></div></div>';
  const d = await api('adminDailyPhotos', { date: asked });
  const max = Math.max(1, ...d.days.map(x => x.n));
  const isToday = d.date === d.today;
  const title = dayParts(d.date).long + ', ' + dateLabel(d.date);
  const regions = Array.from(new Set(d.photos.map(p => p.abbr).filter(Boolean))).sort();
  if (DP.abbr && regions.indexOf(DP.abbr) < 0) DP.abbr = '';

  el.innerHTML =
    '<div class="page-head"><div class="grow"><div class="label">OKB photo list · all regions</div><h1 class="h1">Daily <em>photos</em></h1>' +
    '<p>Every photo the offices uploaded, day by day. Open a photo to see its details or delete it.</p></div>' +
    '<div class="seg" id="dpView"><button data-v="pictures" class="' + (DP.view === 'pictures' ? 'on' : '') + '">' + ic('image') + ' Pictures</button>' +
    '<button data-v="list" class="' + (DP.view === 'list' ? 'on' : '') + '">' + ic('table') + ' List</button></div></div>' +
    '<div class="daybar"><button class="btn ghost sm" id="dpPrev"' + (d.prevDay ? '' : ' disabled') + ' title="Earlier day with photos">' + ic('chevl') + '<span class="hide-sm">Earlier</span></button>' +
    '<input class="input" type="date" id="dpDate" value="' + esc(d.date) + '" max="' + esc(d.today) + '" aria-label="Day to show">' +
    '<button class="btn ghost sm" id="dpNext"' + (d.nextDay ? '' : ' disabled') + ' title="Later day with photos"><span class="hide-sm">Later</span>' + ic('chev') + '</button>' +
    '<button class="btn ' + (isToday ? 'primary' : 'ghost') + ' sm" id="dpToday">' + ic('calendar') + 'Today</button>' +
    '<span class="grow"></span><select class="input" id="dpRegion" aria-label="Region"><option value="">All regions</option>' +
    regions.map(r => '<option' + (r === DP.abbr ? ' selected' : '') + '>' + esc(r) + '</option>').join('') + '</select></div>' +
    '<div class="days">' + d.days.map(x => { const p = dayParts(x.date); return '<button type="button" class="day' + (x.date === d.date ? ' on' : '') + (x.n ? '' : ' zero') + (x.date === d.today ? ' today' : '') +
      '" data-d="' + x.date + '" title="' + esc(dateLabel(x.date)) + ' · ' + x.n + ' photo' + (x.n === 1 ? '' : 's') + '"><small>' + p.wd + '</small><b>' + p.day + '</b><span>' + (x.n ? fmtNum(x.n, 0) : '–') + '</span>' +
      '<i style="transform:scaleX(' + (x.n ? Math.max(0.3, x.n / max) : 0).toFixed(3) + ')"></i></button>'; }).join('') + '</div>' +
    '<div class="stat-row" id="dpStats" style="margin-bottom:14px"></div><div id="dpBody"></div>';

  $('#dpPrev', el).onclick = () => go('/daily/' + d.prevDay);
  $('#dpNext', el).onclick = () => go('/daily/' + d.nextDay);
  $('#dpToday', el).onclick = () => go('/daily/' + d.today);
  $('#dpDate', el).onchange = e => { if (e.target.value) go('/daily/' + e.target.value); };
  $$('.day', el).forEach(b => { b.onclick = () => go('/daily/' + b.dataset.d); });
  $$('#dpView button', el).forEach(b => { b.onclick = () => { DP.view = b.dataset.v; $$('#dpView button', el).forEach(x => x.classList.toggle('on', x === b)); draw(); }; });
  $('#dpRegion', el).onchange = e => { DP.abbr = e.target.value; draw(); };

  const afterDelete = () => route();
  const draw = () => {
    const shown = d.photos.filter(p => !DP.abbr || p.abbr === DP.abbr);
    const uniq = f => new Set(shown.map(f).filter(Boolean)).size;
    $('#dpStats', el).innerHTML = statBox('Photos uploaded', fmtNum(shown.length, 0), '') + statBox('Waterways', fmtNum(uniq(p => p.name), 0), '') +
      statBox('Regions', fmtNum(uniq(p => p.abbr), 0), '') + statBox('Offices', fmtNum(uniq(p => p.office), 0), '');
    setStatus(shown.length + ' photo' + (shown.length === 1 ? '' : 's') + ' uploaded on ' + title + '.', [['Waterways', String(uniq(p => p.name))],
      ['Regions', String(uniq(p => p.abbr))], ['In the list', fmtNum(d.total, 0)]]);
    const body = $('#dpBody', el);
    if (!shown.length) {
      body.innerHTML = '<div class="card"><div class="empty">' + tile('image', 'soft', 'lg') + '<div class="h3">No photos ' + (isToday ? 'yet today' : 'on this day') + '</div>' +
        '<p>' + (isToday ? 'Nothing has been uploaded today so far.' : 'Nothing was uploaded on ' + esc(title) + '.') +
        (d.latest && d.latest !== d.date ? ' The latest uploads were on ' + esc(dateLabel(d.latest)) + '.' : '') + '</p>' +
        (d.latest && d.latest !== d.date ? '<button class="btn primary" id="dpLatest">' + ic('image') + 'Show ' + esc(dateLabel(d.latest)) + '</button>' : '') + '</div></div>';
      const b = $('#dpLatest', el);
      if (b) b.onclick = () => go('/daily/' + d.latest);
      return;
    }
    if (DP.view === 'list') {
      mountGrid(body, [
        { key: 'thumb', label: '', nosort: true, w: '56px', html: p => '<img class="thumb-s" loading="lazy" decoding="async" alt="" src="' + esc(p.url) + '=w120">' },
        { key: 'uploaded', label: 'Uploaded', cls: 'nw', html: p => esc(timeLabel(p.uploaded)) },
        { key: 'abbr', label: 'Region', cls: 'nw' },
        { key: 'name', label: 'Name of waterway', cls: 'nm', html: p => esc(p.name) + '<small>' + esc(p.site) + '</small>' },
        { key: 'office', label: 'Office' },
        { key: 'taken', label: 'Taken', cls: 'nw', html: p => (p.taken ? esc(dateLabel(p.taken)) : '<span class="soft">—</span>') },
        { key: 'lat', label: 'Location', cls: 'nw', html: p => (p.lat ? fmtNum(p.lat, 5) + ', ' + fmtNum(p.lng, 5) : '<span class="soft">none</span>') },
        { key: 'file', label: 'File' },
        { key: 'sid', label: 'No.', cls: 'nw' }
      ], { rows: shown, limit: 200, sortKey: 'uploaded', sortDir: -1, onRow: p => openPhoto(p, afterDelete) });
      return;
    }
    /* pictures: one block per waterway, newest upload first */
    const groups = [];
    const at = {};
    shown.forEach((p, i) => {
      const k = p.abbr + '|' + norm(p.name);
      if (at[k] === undefined) { at[k] = groups.length; groups.push({ name: p.name, site: p.site, abbr: p.abbr, region: p.region, items: [] }); }
      groups[at[k]].items.push({ p: p, i: i });
    });
    body.innerHTML = groups.map(g => {
      const offices = Array.from(new Set(g.items.map(x => x.p.office).filter(Boolean)));
      return '<div class="card pgroup"><div class="pgroup-head"><b>' + esc(titleCase(g.name)) + '</b><span class="pill navy">' + esc(g.abbr || '—') + '</span>' +
        '<span class="small muted pg-sub">' + esc(g.site) + ' · ' + g.items.length + ' photo' + (g.items.length === 1 ? '' : 's') + (offices.length ? ' · ' + esc(offices.join(', ')) : '') + '</span>' +
        '<a class="link small pg-open" href="#/waterway/' + encodePath(g.name, g.site) + '">Open waterway ' + ic('chev') + '</a></div>' +
        '<div class="photos-grid">' + g.items.map(x => '<div class="ph" data-ph="' + x.i + '" tabindex="0"><img loading="lazy" decoding="async" alt="" src="' + esc(x.p.url) +
          '=w400" onerror="this.parentNode.classList.add(\'broken\');this.remove()"><span class="tag">' + esc(timeLabel(x.p.uploaded)) + '</span>' +
          '<div class="cap">' + (x.p.taken ? 'Taken ' + esc(dateLabel(x.p.taken).split(' · ')[0]) : 'No date taken') + '</div></div>').join('') + '</div></div>';
    }).join('') + (d.more ? '<div class="empty small">' + d.more + ' more photos were uploaded this day. Choose a region to narrow the list.</div>' : '');
    bindPhotoGrid(body, shown, afterDelete);
  };
  draw();
};

   not uploaded, nothing happens. */
if (!HAS_GAS && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* optional */ }); });
}
